    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getLuminance(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      const lin = v => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
      return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    }

    function getReadableTextColor(hex) {
      return getLuminance(hex) > 0.55 ? '#1f1f1f' : '#ffffff';
    }

    function buildRoundedRectPath(rx, ry, rw, rh, radius) {
      const r = Math.max(0, Math.min(radius, rw / 2, rh / 2));
      ctx.beginPath();
      ctx.moveTo(rx + r, ry);
      ctx.lineTo(rx + rw - r, ry);
      ctx.arcTo(rx + rw, ry, rx + rw, ry + r, r);
      ctx.lineTo(rx + rw, ry + rh - r);
      ctx.arcTo(rx + rw, ry + rh, rx + rw - r, ry + rh, r);
      ctx.lineTo(rx + r, ry + rh);
      ctx.arcTo(rx, ry + rh, rx, ry + rh - r, r);
      ctx.lineTo(rx, ry + r);
      ctx.arcTo(rx, ry, rx + r, ry, r);
      ctx.closePath();
    }

    function fillRoundedRect(rx, ry, rw, rh, radius) {
      buildRoundedRectPath(rx, ry, rw, rh, radius);
      ctx.fill();
    }

    function strokeRoundedRect(rx, ry, rw, rh, radius) {
      buildRoundedRectPath(rx, ry, rw, rh, radius);
      ctx.stroke();
    }

    function easeInOut(t) {
      const clamped = Math.max(0, Math.min(1, t));
      return clamped * clamped * (3 - 2 * clamped);
    }

    // ============================================
    // CANVAS SETUP
    // ============================================

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      calculateLayout();
    }

    function calculateLayout() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const level = getCurrentLevel();
      const gridCount = level ? level.gridSize : 3;

      // Grid takes 85% of the smaller dimension
      const maxSize = Math.min(w, h) * 0.85;
      layout.gridSize = maxSize;
      layout.cellSize = maxSize / gridCount;
      layout.gridX = (w - maxSize) / 2;
      layout.gridY = (h - maxSize) / 2;
    }

    // ============================================
    // LEVEL MANAGEMENT
    // ============================================

    function loadLevel(levelIndex, packIndex = state.currentPack) {
      const pack = PACKS[packIndex];
      const level = pack.levels[levelIndex];
      state.currentPack = packIndex;
      state.currentLevel = levelIndex;
      state.playingDaily = false;
      state.grid = deepCopy(level.initial);
      state.tapsRemaining = level.tapsRequired;
      state.history = [];
      state.tapSequence = [];
      state.showingWin = false;
      state.showingLevelSelect = false;
      state.showingDailySelect = false;
      state.showingAchievements = false;
      state.animating = false;
      animations = [];
      calculateLayout();
      updateAchievements();
      saveProgress();
    }

    function loadDailyLevel(levelIndex) {
      const pack = getDailyPack();
      const level = pack.levels[levelIndex];
      state.currentLevel = levelIndex;
      state.playingDaily = true;
      state.grid = deepCopy(level.initial);
      state.tapsRemaining = level.tapsRequired;
      state.history = [];
      state.tapSequence = [];
      state.showingWin = false;
      state.showingLevelSelect = false;
      state.showingDailySelect = false;
      state.showingAchievements = false;
      state.animating = false;
      animations = [];
      calculateLayout();
      updateAchievements();
      saveProgress();
    }

    function isSolved() {
      const level = getCurrentLevel();
      const grid = state.grid;
      for (let r = 0; r < level.gridSize; r++) {
        for (let c = 0; c < level.gridSize; c++) {
          if (grid[r][c].parity !== 0) return false;
          if (grid[r][c].dot === 1) return false;
        }
      }
      return true;
    }

    function checkWin() {
      if (state.tapsRemaining !== 0) return false;
      return isSolved();
    }

    function handleWin() {
      state.showingWin = true;
      state.winTime = performance.now();
      const key = levelKey(state.currentPack, state.currentLevel);
      const level = getCurrentLevel();
      recordDailyMechanic(level.mechanic, state.playingDaily);
      if (!state.playingDaily) {
        if (!state.completedLevels.includes(key)) {
          state.completedLevels.push(key);
          state.stats.levelsCompleted += 1;
          if (state.stats.levelsByMechanic[level.mechanic] !== undefined) {
            state.stats.levelsByMechanic[level.mechanic] += 1;
          }
        }
      }
      updateAchievements();
      saveProgress();
    }

    // ============================================
    // GAME LOGIC
    // ============================================

    function handleTap(row, col, tapX = 0.5, tapY = 0.5) {
      if (state.showingWin || state.showingLevelSelect || state.showingPackSelect || state.animating || state.transitioning) return;
      if (state.tapsRemaining <= 0) return;

      const level = getCurrentLevel();
      const gridSize = level.gridSize;
      const mechanic = level.mechanic;
      const hasBlocks = mechanicHas(mechanic, 'blocks');
      const hasEcho = mechanicHas(mechanic, 'echo');
      const hasWind = mechanicHas(mechanic, 'wind');
      const hasDots = mechanicHas(mechanic, 'dots');
      const isBlocked = (r, c) => hasBlocks && state.grid[r][c].block === 1;
      const pendingEcho = new Set();
      const isEcho = (r, c) => hasEcho && state.grid[r][c].echo === 1 && !pendingEcho.has(`${r},${c}`);
      const isWind = (r, c) => hasWind && state.grid[r][c].wind === 1;

      if (hasBlocks && isBlocked(row, col)) {
        state.stats.blockedTaps += 1;
        return;
      }
      if (hasEcho && isEcho(row, col)) {
        return;
      }

      // Block further taps during animation
      state.animating = true;
      state.stats.totalTaps += 1;

      // Calculate max distance for wave timing
      let maxDist = 0;
      const pulseDuration = 300;
      const waveDelay = 80;
      const echoDelay = 160;

      // Save state for undo (including tapsRemaining)
      state.history.push({ grid: deepCopy(state.grid), tapsRemaining: state.tapsRemaining });
      state.tapSequence.push({ row, col });

      // Decrement taps remaining
      state.tapsRemaining--;

      // Keep only last 50 moves for memory
      if (state.history.length > 50) {
        state.history.shift();
      }

      const usedMoveIndex = state.tapsRemaining;
      animations.push({
        type: 'move',
        index: usedMoveIndex,
        startTime: performance.now(),
        duration: pulseDuration,
      });

      const triggeredEcho = new Set();
      const tapQueue = [{ row, col, startDelay: 0 }];
      let totalDuration = 0;

      function scheduleTapWave(tapRow, tapCol, baseDelay) {
        if (hasBlocks && isBlocked(tapRow, tapCol)) {
          return;
        }

        const triggeredThisTap = [];
        let waveMaxDist = 0;

        const maybeCollectEcho = (r, c, delay) => {
          if (!hasEcho || !isEcho(r, c)) return;
          const key = `${r},${c}`;
          if (triggeredEcho.has(key)) return;
          triggeredEcho.add(key);
          pendingEcho.add(key);
          state.stats.echoTriggers += 1;
          animations.push({
            type: 'echo-hit',
            row: r,
            col: c,
            startTime: performance.now() + delay,
            duration: pulseDuration * 0.9,
          });
          triggeredThisTap.push({ row: r, col: c, key });
        };

        const removeDots = hasDots;

        const scheduleToggle = (r, c, dist, removeDot, suppressWindFlow = false, extraDelay = 0) => {
          const delay = baseDelay + extraDelay + dist * waveDelay;
          maxDist = Math.max(maxDist, dist);
          waveMaxDist = Math.max(waveMaxDist, dist);
          const hadWind = hasWind && state.grid[r][c].wind === 1;
          const windDir = hadWind ? state.grid[r][c].windDir : 0;
          toggleCell(r, c, delay, 'pulse', pulseDuration, removeDot);
          totalDuration = Math.max(totalDuration, delay + pulseDuration);
          maybeCollectEcho(r, c, delay);
          if (hadWind && !suppressWindFlow) {
            scheduleWindFlow(r, c, windDir, delay);
          }
        };

        const scheduleWindFlow = (originRow, originCol, dir, startDelay) => {
          const extraDelay = Math.max(0, startDelay - baseDelay);
          const deltas = [
            { dr: -1, dc: 0 },
            { dr: 0, dc: 1 },
            { dr: 1, dc: 0 },
            { dr: 0, dc: -1 },
          ];
          const delta = deltas[dir] || deltas[0];
          let step = 1;
          let r = originRow + delta.dr;
          let c = originCol + delta.dc;
          while (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
            if (hasBlocks && isBlocked(r, c)) {
              break;
            }
            scheduleToggle(r, c, Math.max(step, 1), removeDots, false, extraDelay);
            r += delta.dr;
            c += delta.dc;
            step += 1;
          }
        };

        if (hasWind && isWind(tapRow, tapCol)) {
          const dir = state.grid[tapRow][tapCol].windDir;
          scheduleToggle(tapRow, tapCol, 0, removeDots, true);
          scheduleWindFlow(tapRow, tapCol, dir, baseDelay);

          return;
        }

        scheduleToggle(tapRow, tapCol, 0, removeDots);

        for (let c = tapCol - 1; c >= 0; c--) {
          if (hasBlocks && isBlocked(tapRow, c)) {
            break;
          }
          scheduleToggle(tapRow, c, Math.abs(c - tapCol), removeDots);
        }
        for (let c = tapCol + 1; c < gridSize; c++) {
          if (hasBlocks && isBlocked(tapRow, c)) {
            break;
          }
          scheduleToggle(tapRow, c, Math.abs(c - tapCol), removeDots);
        }

        for (let r = tapRow - 1; r >= 0; r--) {
          if (hasBlocks && isBlocked(r, tapCol)) {
            break;
          }
          scheduleToggle(r, tapCol, Math.abs(r - tapRow), removeDots);
        }
        for (let r = tapRow + 1; r < gridSize; r++) {
          if (hasBlocks && isBlocked(r, tapCol)) {
            break;
          }
          scheduleToggle(r, tapCol, Math.abs(r - tapRow), removeDots);
        }

        if (triggeredThisTap.length > 0) {
          const echoStart = baseDelay + waveMaxDist * waveDelay + pulseDuration + echoDelay;
          totalDuration = Math.max(totalDuration, echoStart + pulseDuration);
          for (const cell of triggeredThisTap) {
            tapQueue.push({ row: cell.row, col: cell.col, startDelay: echoStart });
            setTimeout(() => {
              state.grid[cell.row][cell.col].echo = 0;
              pendingEcho.delete(cell.key);
            }, echoStart);
            animations.push({
              type: 'echo-fire',
              row: cell.row,
              col: cell.col,
              startTime: performance.now() + echoStart,
              duration: pulseDuration,
            });
          }
        }
      }

      while (tapQueue.length) {
        const tap = tapQueue.shift();
        scheduleTapWave(tap.row, tap.col, tap.startDelay);
      }

      // Check win and re-enable tapping after animations complete
      setTimeout(() => {
        state.animating = false;
        if (checkWin()) {
          handleWin();
        }
      }, totalDuration + 50);

      saveProgress();
    }

    function toggleCell(row, col, delay = 0, direction = 'horizontal', duration = 300, removeDot = false) {
      const cell = state.grid[row][col];
      const previousParity = cell.parity;

      if (removeDot && cell.dot === 1) {
        const startTime = performance.now() + delay;
        const hasActiveDot = animations.some(anim =>
          anim.type === 'dot' && anim.row === row && anim.col === col && startTime < anim.startTime + anim.duration
        );
        if (!hasActiveDot) {
          animations.push({
            type: 'dot',
            row,
            col,
            startTime,
            duration,
          });
        }
      }

      // Toggle parity
      cell.parity = (cell.parity + 1) % 2;
      if (cell.wind === 1) {
        const removeDelay = Math.max(0, delay);
        setTimeout(() => {
          const current = state.grid?.[row]?.[col];
          if (!current || current !== cell) return;
          if (current.wind === 1) {
            current.wind = 0;
            current.windDir = 0;
          }
        }, removeDelay);
      }

      // Add wave flip animation - stores previous state for smooth transition
      animations.push({
        type: 'flip',
        row,
        col,
        direction,
        startTime: performance.now() + delay,
        duration,
        previousParity,
      });
    }

    function undo() {
      if (state.history.length > 0 && !state.showingWin && !state.showingLevelSelect) {
        const prevState = state.history.pop();
        state.grid = prevState.grid;
        state.tapsRemaining = prevState.tapsRemaining;
        if (state.tapSequence.length > 0) {
          state.tapSequence.pop();
        }
        state.animating = false;
        animations = [];
        state.stats.totalUndos += 1;
        updateAchievements();
        saveProgress();
      }
    }

    function resetLevel() {
      if (!state.showingLevelSelect) {
        state.stats.totalResets += 1;
        updateAchievements();
        loadLevel(state.currentLevel);
      }
    }

    function getHintCell() {
      const level = getCurrentLevel();
      if (!level || !level.solution || level.solution.length === 0) return null;
      const used = new Set(state.tapSequence.map(tap => `${tap.row},${tap.col}`));
      for (const tap of level.solution) {
        const key = `${tap.row},${tap.col}`;
        if (!used.has(key)) {
          return tap;
        }
      }
      return null;
    }

    function showHint() {
      if (state.showingWin || state.showingLevelSelect || state.animating) return;
      if (state.tapsRemaining <= 0) return;
      const hint = getHintCell();
      if (!hint) return;
      state.stats.totalHints += 1;
      updateAchievements();
      animations = animations.filter(anim => anim.type !== 'hint');
      animations.push({
        type: 'hint',
        row: hint.row,
        col: hint.col,
        startTime: performance.now(),
        duration: 1200,
        pulses: 2,
      });
      saveProgress();
    }

    function isInvalidState() {
      return state.tapsRemaining === 0 && !state.animating && !state.showingWin && !isSolved();
    }

    function getMoveBarLayout() {
      const level = getCurrentLevel();
      if (!level) return null;
      const totalMoves = level.tapsRequired;
      if (totalMoves <= 0) return null;

      const barHeight = Math.max(3, layout.cellSize * 0.06);
      const barY = layout.gridY + layout.gridSize + 14;
      const barX = layout.gridX;
      const barWidth = layout.gridSize;
      return { x: barX, y: barY, w: barWidth, h: barHeight };
    }

    // ============================================
    // PERSISTENCE
    // ============================================

    function saveProgress() {
      const saveData = {
        completedLevels: state.completedLevels,
        achievementsUnlocked: state.achievementsUnlocked,
        stats: state.stats,
        daily: state.daily,
        saveVersion: 4,
      };
      try {
        localStorage.setItem('parity_save_v3', JSON.stringify(saveData));
      } catch (e) {
        // Storage might be full or unavailable
      }
    }

    function loadProgress() {
      try {
        const saved = localStorage.getItem('parity_save_v3') || localStorage.getItem('parity_save_v2');
        if (saved) {
          const data = JSON.parse(saved);
          const completed = data.completedLevels || [];
          const saveVersion = data.saveVersion || 0;
          if (completed.length > 0 && typeof completed[0] === 'number') {
            const mapped = [];
            for (const idx of completed) {
              const key = indexToKey(idx);
              if (key) mapped.push(key);
            }
            const hasLegacyEcho = saveVersion < 4 && mapped.some(key => parseInt(key.split(':')[0], 10) === 3);
            state.completedLevels = remapCompletedLevels(mapped, hasLegacyEcho);
          } else {
            const filtered = completed.filter(key => typeof key === 'string');
            const hasLegacyEcho = saveVersion < 4 && filtered.some(key => parseInt(key.split(':')[0], 10) === 3);
            state.completedLevels = remapCompletedLevels(filtered, hasLegacyEcho);
          }
          state.achievementsUnlocked = data.achievementsUnlocked || [];
          state.stats = normalizeStats(data.stats);
          state.daily = normalizeDaily(data.daily);
          if (!data.stats && state.completedLevels.length > 0) {
            state.stats = rebuildStatsFromProgress();
          }
          ensureDailyState();
          updateAchievements();
          return true;
        }
      } catch (e) {
        // Corrupted save, start fresh
      }
      state.completedLevels = [];
      state.achievementsUnlocked = [];
      state.stats = createDefaultStats();
      state.daily = createDefaultDaily();
      ensureDailyState();
      updateAchievements();
      return false;
    }

    // ============================================
    // INPUT HANDLING
    // ============================================

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return { x, y };
    }

    function screenToGrid(x, y) {
      const level = getCurrentLevel();
      const gridSize = level.gridSize;

      const relX = x - layout.gridX;
      const relY = y - layout.gridY;

      if (relX < 0 || relY < 0 || relX > layout.gridSize || relY > layout.gridSize) {
        return null;
      }

      const col = Math.floor(relX / layout.cellSize);
      const row = Math.floor(relY / layout.cellSize);

      if (row < 0 || row >= gridSize || col < 0 || col >= gridSize) {
        return null;
      }

      return { row, col };
    }

    const CONTROL_LABELS = [
      { id: 'levelSelect', label: 'Menu' },
      { id: 'reset', label: 'Reset' },
      { id: 'undo', label: 'Undo' },
      { id: 'hint', label: 'Hint' },
    ];

    function getControlButtons() {
      const w = window.innerWidth;
      const paddingX = 14;
      const paddingY = 7;
      const gap = 8;
      const font = '14px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.font = font;

      const height = 28 + paddingY;
      const y = 52;

      const menuWidth = ctx.measureText(CONTROL_LABELS[0].label).width + paddingX * 2;
      const rightLabels = CONTROL_LABELS.slice(1);
      const rightWidths = rightLabels.map(btn => ctx.measureText(btn.label).width + paddingX * 2);
      const rightTotal = rightWidths.reduce((sum, v) => sum + v, 0) + gap * (rightWidths.length - 1);

      const buttons = [];
      // Menu top-left
      buttons.push({
        id: CONTROL_LABELS[0].id,
        label: CONTROL_LABELS[0].label,
        x: 20,
        y,
        w: menuWidth,
        h: height,
      });

      // Other controls grouped top-right
      let cursor = w - 20 - rightTotal;
      for (let i = 0; i < rightLabels.length; i++) {
        const width = rightWidths[i];
        buttons.push({
          id: rightLabels[i].id,
          label: rightLabels[i].label,
          x: cursor,
          y,
          w: width,
          h: height,
        });
        cursor += width + gap;
      }

      return buttons;
    }

    function getControlHit(x, y) {
      const buttons = getControlButtons();
      for (const btn of buttons) {
        if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
          return btn.id;
        }
      }
      return null;
    }

    function getPackButtonRect() {
      return { x: 20, y: 20, w: 68, h: 24 };
    }

    function getAchievementsButtonRect() {
      const w = window.innerWidth;
      return { x: w - 132, y: 20, w: 112, h: 24 };
    }

    function getAchievementsBackRect() {
      return { x: 20, y: 20, w: 68, h: 24 };
    }

    function handlePointerDown(e) {
      e.preventDefault();
      pointerStart = getPointerPos(e);
    }

    function handlePointerUp(e) {
      e.preventDefault();
      if (!pointerStart) return;

      const pos = e.changedTouches ?
        { x: e.changedTouches[0].clientX - canvas.getBoundingClientRect().left,
          y: e.changedTouches[0].clientY - canvas.getBoundingClientRect().top } :
        getPointerPos(e);

      const dx = pos.x - pointerStart.x;
      const dy = pos.y - pointerStart.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Swipe for level select paging
      if (state.showingLevelSelect && !state.transitioning && dist >= 10) {
        const swipeThreshold = 40;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > swipeThreshold) {
          const totalPages = Math.ceil(getCurrentPack().levels.length / levelsPerPage);
          if (dx < 0 && levelSelectPage < totalPages - 1) {
            levelSelectPage++;
          } else if (dx > 0 && levelSelectPage > 0) {
            levelSelectPage--;
          }
          pointerStart = null;
          return;
        }
      }

      // Swipe for achievements paging
      if (state.showingAchievements && !state.transitioning && dist >= 10) {
        const swipeThreshold = 40;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > swipeThreshold) {
          const totalPages = Math.ceil(ACHIEVEMENTS.length / achievementsPerPage);
          if (dx < 0 && achievementsPage < totalPages - 1) {
            achievementsPage++;
          } else if (dx > 0 && achievementsPage > 0) {
            achievementsPage--;
          }
          pointerStart = null;
          return;
        }
      }

      // Only register as tap if movement < 10px
      if (dist < 10) {
        handleClick(pos.x, pos.y);
      }

      pointerStart = null;
    }

    function handleClick(x, y) {
      if (state.transitioning) return;
      if (state.showingPackSelect) {
        const dailyRect = getDailyCardRect();
        if (x >= dailyRect.x && x <= dailyRect.x + dailyRect.w && y >= dailyRect.y && y <= dailyRect.y + dailyRect.h) {
          achievementsPage = 0;
          state.transitioning = true;
          state.transition = {
            kind: 'toDailySelect',
            startTime: performance.now(),
          };
          return;
        }
        const achBtn = getAchievementsButtonRect();
        if (x >= achBtn.x && x <= achBtn.x + achBtn.w && y >= achBtn.y && y <= achBtn.y + achBtn.h) {
          achievementsPage = 0;
          state.transitioning = true;
          state.transition = {
            kind: 'toAchievements',
            startTime: performance.now(),
          };
          return;
        }
        const selectedPack = getPackSelectHit(x, y);
        if (selectedPack !== null) {
          state.currentPack = selectedPack;
          state.currentLevel = 0;
          levelSelectPage = 0;
          state.transitioning = true;
          state.transition = {
            kind: 'toPackLevels',
            startTime: performance.now(),
            packIndex: selectedPack,
          };
        }
        return;
      }
      if (state.showingAchievements) {
        const backBtn = getAchievementsBackRect();
        if (x >= backBtn.x && x <= backBtn.x + backBtn.w && y >= backBtn.y && y <= backBtn.y + backBtn.h) {
          state.transitioning = true;
          state.transition = {
            kind: 'toPackSelectFromAchievements',
            startTime: performance.now(),
          };
          return;
        }

        const w = window.innerWidth;
        const h = window.innerHeight;
        const totalPages = Math.ceil(ACHIEVEMENTS.length / achievementsPerPage);
        if (x < 50 && y > h / 2 - 30 && y < h / 2 + 30 && achievementsPage > 0) {
          achievementsPage--;
          return;
        }
        if (x > w - 50 && y > h / 2 - 30 && y < h / 2 + 30 && achievementsPage < totalPages - 1) {
          achievementsPage++;
          return;
        }
        return;
      }
      if (state.showingDailySelect) {
        const backBtn = getPackButtonRect();
        if (x >= backBtn.x && x <= backBtn.x + backBtn.w && y >= backBtn.y && y <= backBtn.y + backBtn.h) {
          state.transitioning = true;
          state.transition = {
            kind: 'toPackSelectFromDaily',
            startTime: performance.now(),
          };
          return;
        }
        const selected = getDailySelectHit(x, y);
        if (selected !== null && !state.transitioning) {
          state.transitioning = true;
          state.transition = {
            kind: 'toDailyLevel',
            phase: 'out',
            startTime: performance.now(),
            toLevel: selected,
          };
        }
        return;
      }
      // Check for win screen tap
      if (state.showingWin) {
        const elapsed = performance.now() - state.winTime;
        if (elapsed > 500) {
          // Auto-advance to next level or back to level select
          const pack = getCurrentPack();
          if (state.currentLevel < pack.levels.length - 1) {
            if (state.playingDaily) {
              loadDailyLevel(state.currentLevel + 1);
            } else {
              loadLevel(state.currentLevel + 1, state.currentPack);
            }
          } else {
            if (state.playingDaily) {
              state.showingDailySelect = true;
            } else {
              state.showingLevelSelect = true;
            }
            state.showingWin = false;
          }
        }
        return;
      }

      // Check for level select screen
      if (state.showingLevelSelect) {
        const packBtn = getPackButtonRect();
        if (x >= packBtn.x && x <= packBtn.x + packBtn.w && y >= packBtn.y && y <= packBtn.y + packBtn.h) {
          state.transitioning = true;
          state.transition = {
            kind: 'toPackSelect',
            startTime: performance.now(),
          };
          return;
        }
        const selected = getLevelSelectHit(x, y);
        if (selected !== null && !state.transitioning) {
          state.transitioning = true;
          state.transition = {
            kind: 'toLevel',
            phase: 'out',
            startTime: performance.now(),
            toLevel: selected,
          };
        }
        return;
      }

      // Check grid tap
      const cell = screenToGrid(x, y);
      if (cell) {
        // Calculate tap position within cell (0-1 range)
        const cellX = layout.gridX + cell.col * layout.cellSize;
        const cellY = layout.gridY + cell.row * layout.cellSize;
        const tapX = (x - cellX) / layout.cellSize;
        const tapY = (y - cellY) / layout.cellSize;
        handleTap(cell.row, cell.col, tapX, tapY);
        return;
      }

      // Check control buttons
      const control = getControlHit(x, y);
      if (control === 'levelSelect') {
        if (state.playingDaily) {
          if (!state.transitioning) {
            state.transitioning = true;
            state.transition = {
              kind: 'toDailySelectFromGame',
              startTime: performance.now(),
            };
          }
        } else {
          levelSelectPage = Math.floor(state.currentLevel / levelsPerPage);
          if (!state.transitioning) {
            state.transitioning = true;
            state.transition = {
              kind: 'toMenu',
              startTime: performance.now(),
            };
          }
        }
        return;
      }
      if (control === 'reset') {
        resetLevel();
        return;
      }
      if (control === 'undo') {
        undo();
        return;
      }
      if (control === 'hint') {
        showHint();
        return;
      }

      const moveBar = getMoveBarLayout();
      if (moveBar && x >= moveBar.x && x <= moveBar.x + moveBar.w && y >= moveBar.y && y <= moveBar.y + moveBar.h) {
        undo();
        return;
      }
    }

    function getLevelSelectHit(x, y) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cols = 5;
      const rows = 6;
      const cellSize = Math.min(w * 0.9 / cols, h * 0.72 / rows);
      const gridW = cols * cellSize;
      const gridH = rows * cellSize;
      const startX = (w - gridW) / 2;
      const startY = (h - gridH) / 2 + 20;

      const totalPages = Math.ceil(getCurrentPack().levels.length / levelsPerPage);

      // Check left arrow
      if (x < 50 && y > h / 2 - 30 && y < h / 2 + 30 && levelSelectPage > 0) {
        levelSelectPage--;
        return null;
      }

      // Check right arrow
      if (x > w - 50 && y > h / 2 - 30 && y < h / 2 + 30 && levelSelectPage < totalPages - 1) {
        levelSelectPage++;
        return null;
      }

      const col = Math.floor((x - startX) / cellSize);
      const row = Math.floor((y - startY) / cellSize);

      if (col >= 0 && col < cols && row >= 0 && row < rows) {
        const idx = row * cols + col;
        const level = levelSelectPage * levelsPerPage + idx;
        if (level < getCurrentPack().levels.length) {
          return level;
        }
      }
      return null;
    }

    // ============================================
    // RENDERING
    // ============================================

    function render() {
      const now = performance.now();
      const w = window.innerWidth;
      const h = window.innerHeight;
      const level = getCurrentLevel();
      const palette = PALETTES[level.palette];

      // Clear with background color (target color = tileA)
      ctx.fillStyle = palette.bg;
      ctx.fillRect(0, 0, w, h);

      if (state.transitioning && state.transition) {
        const outDuration = 360;
        const inDuration = 420;
        if (state.transition.kind === 'toLevel') {
          if (state.transition.phase === 'out') {
            const t = easeInOut((now - state.transition.startTime) / outDuration);
            renderLevelSelect(0, 1 - t);
            if (t >= 1) {
              loadLevel(state.transition.toLevel, state.currentPack);
              state.showingLevelSelect = false;
              state.transition.phase = 'in';
              state.transition.startTime = now;
            }
          } else if (state.transition.phase === 'in') {
            const t = easeInOut((now - state.transition.startTime) / inDuration);
            ctx.save();
            ctx.globalAlpha = t;
            renderGrid(now);
            if (isInvalidState()) {
              renderInvalidOverlay();
            }
            renderMoveBorder(now);
            ctx.restore();
            renderControls((1 - t) * -18, t);
            if (state.showingWin) {
              renderWinOverlay(now);
            }
            if (t >= 1) {
              state.transitioning = false;
              state.transition = null;
            }
          }
        } else if (state.transition.kind === 'toMenu') {
          const t = easeInOut((now - state.transition.startTime) / outDuration);
          ctx.save();
          ctx.globalAlpha = 1 - t;
          renderGrid(now);
          if (isInvalidState()) {
            renderInvalidOverlay();
          }
          renderMoveBorder(now);
          renderControls(0, 1);
          ctx.restore();
          renderLevelSelect(0, t);
          if (t >= 1) {
            state.transitioning = false;
            state.transition = null;
            state.showingPackSelect = false;
            state.showingLevelSelect = true;
          }
        } else if (state.transition.kind === 'toPackLevels') {
          const t = easeInOut((now - state.transition.startTime) / outDuration);
          renderPackSelect(1 - t);
          renderLevelSelect(0, t);
          if (t >= 1) {
            state.transitioning = false;
            state.transition = null;
            state.showingPackSelect = false;
            state.showingLevelSelect = true;
          }
        } else if (state.transition.kind === 'toPackSelect') {
          const t = easeInOut((now - state.transition.startTime) / outDuration);
          renderLevelSelect(0, 1 - t);
          renderPackSelect(t);
          if (t >= 1) {
            state.transitioning = false;
            state.transition = null;
            state.showingPackSelect = true;
            state.showingLevelSelect = false;
          }
        } else if (state.transition.kind === 'toDailySelect') {
          const t = easeInOut((now - state.transition.startTime) / outDuration);
          renderPackSelect(1 - t);
          renderDailySelect(t);
          if (t >= 1) {
            state.transitioning = false;
            state.transition = null;
            state.showingPackSelect = false;
            state.showingDailySelect = true;
          }
        } else if (state.transition.kind === 'toPackSelectFromDaily') {
          const t = easeInOut((now - state.transition.startTime) / outDuration);
          renderDailySelect(1 - t);
          renderPackSelect(t);
          if (t >= 1) {
            state.transitioning = false;
            state.transition = null;
            state.showingPackSelect = true;
            state.showingDailySelect = false;
          }
        } else if (state.transition.kind === 'toDailyLevel') {
          if (state.transition.phase === 'out') {
            const t = easeInOut((now - state.transition.startTime) / outDuration);
            renderDailySelect(0, 1 - t);
            if (t >= 1) {
              loadDailyLevel(state.transition.toLevel);
              state.transition.phase = 'in';
              state.transition.startTime = now;
            }
          } else if (state.transition.phase === 'in') {
            const t = easeInOut((now - state.transition.startTime) / inDuration);
            ctx.save();
            ctx.globalAlpha = t;
            renderGrid(now);
            if (isInvalidState()) {
              renderInvalidOverlay();
            }
            renderMoveBorder(now);
            ctx.restore();
            renderControls((1 - t) * -18, t);
            if (state.showingWin) {
              renderWinOverlay(now);
            }
            if (t >= 1) {
              state.transitioning = false;
              state.transition = null;
            }
          }
        } else if (state.transition.kind === 'toDailySelectFromGame') {
          const t = easeInOut((now - state.transition.startTime) / outDuration);
          ctx.save();
          ctx.globalAlpha = 1 - t;
          renderGrid(now);
          if (isInvalidState()) {
            renderInvalidOverlay();
          }
          renderMoveBorder(now);
          renderControls(0, 1);
          ctx.restore();
          renderDailySelect(t);
          if (t >= 1) {
            state.transitioning = false;
            state.transition = null;
            state.showingDailySelect = true;
            state.playingDaily = false;
          }
        } else if (state.transition.kind === 'toAchievements') {
          const t = easeInOut((now - state.transition.startTime) / outDuration);
          renderPackSelect(1 - t);
          renderAchievements(t);
          if (t >= 1) {
            state.transitioning = false;
            state.transition = null;
            state.showingPackSelect = false;
            state.showingAchievements = true;
          }
        } else if (state.transition.kind === 'toPackSelectFromAchievements') {
          const t = easeInOut((now - state.transition.startTime) / outDuration);
          renderAchievements(1 - t);
          renderPackSelect(t);
          if (t >= 1) {
            state.transitioning = false;
            state.transition = null;
            state.showingPackSelect = true;
            state.showingAchievements = false;
          }
        }
      } else if (state.showingPackSelect) {
        renderPackSelect();
      } else if (state.showingDailySelect) {
        renderDailySelect();
      } else if (state.showingAchievements) {
        renderAchievements();
      } else if (state.showingLevelSelect) {
        renderLevelSelect();
      } else {
        renderGrid(now);
        if (isInvalidState()) {
          renderInvalidOverlay();
        }
        renderMoveBorder(now);
        renderControls(0, 1);

        if (state.showingWin) {
          renderWinOverlay(now);
        }
      }

      // Clean up finished animations
      animations = animations.filter(a => now < a.startTime + a.duration);

      requestAnimationFrame(render);
    }

    function renderGrid(now) {
      const level = getCurrentLevel();
      const palette = PALETTES[level.palette];
      const gridSize = level.gridSize;

      function buildRoundedRectPath(rx, ry, rw, rh, radii) {
        const [tl, tr, br, bl] = radii;
        ctx.beginPath();
        ctx.moveTo(rx + tl, ry);
        ctx.lineTo(rx + rw - tr, ry);
        if (tr > 0) {
          ctx.arcTo(rx + rw, ry, rx + rw, ry + tr, tr);
        }
        ctx.lineTo(rx + rw, ry + rh - br);
        if (br > 0) {
          ctx.arcTo(rx + rw, ry + rh, rx + rw - br, ry + rh, br);
        }
        ctx.lineTo(rx + bl, ry + rh);
        if (bl > 0) {
          ctx.arcTo(rx, ry + rh, rx, ry + rh - bl, bl);
        }
        ctx.lineTo(rx, ry + tl);
        if (tl > 0) {
          ctx.arcTo(rx, ry, rx + tl, ry, tl);
        }
        ctx.closePath();
      }

      function drawRoundedRectFill(rx, ry, rw, rh, radii) {
        buildRoundedRectPath(rx, ry, rw, rh, radii);
        ctx.fill();
      }

      function drawRoundedRectStroke(rx, ry, rw, rh, radii) {
        buildRoundedRectPath(rx, ry, rw, rh, radii);
        ctx.stroke();
      }

      function blendColors(color1, color2, t) {
        const r1 = parseInt(color1.slice(1, 3), 16);
        const g1 = parseInt(color1.slice(3, 5), 16);
        const b1 = parseInt(color1.slice(5, 7), 16);
        const r2 = parseInt(color2.slice(1, 3), 16);
        const g2 = parseInt(color2.slice(3, 5), 16);
        const b2 = parseInt(color2.slice(5, 7), 16);
        const rm = Math.round(r1 + (r2 - r1) * t);
        const gm = Math.round(g1 + (g2 - g1) * t);
        const bm = Math.round(b1 + (b2 - b1) * t);
        return `rgb(${rm},${gm},${bm})`;
      }

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const cell = state.grid[r][c];
          // Round to whole pixels and add 1px overlap to prevent gaps
          const x = Math.floor(layout.gridX + c * layout.cellSize);
          const y = Math.floor(layout.gridY + r * layout.cellSize);
          const centerX = x + layout.cellSize / 2;
          const centerY = y + layout.cellSize / 2;

          // Get animations for this cell (active or pending)
          let slideAnim = null;
          let hintAnim = null;
          let echoHitAnim = null;
          let echoFireAnim = null;
          let dotAnim = null;

          for (const anim of animations) {
            if (anim.row === r && anim.col === c) {
              const elapsed = now - anim.startTime;
              if (anim.type === 'flip' && elapsed < anim.duration) {
                slideAnim = { elapsed, anim };
              } else if (anim.type === 'hint' && elapsed >= 0 && elapsed < anim.duration) {
                hintAnim = { elapsed, anim };
              } else if (anim.type === 'echo-hit' && elapsed >= 0 && elapsed < anim.duration) {
                echoHitAnim = { elapsed, anim };
              } else if (anim.type === 'echo-fire' && elapsed >= 0 && elapsed < anim.duration) {
                echoFireAnim = { elapsed, anim };
              } else if (anim.type === 'dot' && elapsed >= 0) {
                dotAnim = { elapsed, anim };
              }
            }
          }

          // Draw cell with pulse compression animation
          const baseSize = layout.cellSize;

          // Get current display parity for this cell
          let displayParity = cell.parity;
          let isAnimating = false;
          let animProgress = 0;

          if (slideAnim) {
            const { elapsed, anim } = slideAnim;
            if (elapsed < 0) {
              displayParity = anim.previousParity;
            } else {
              isAnimating = true;
              animProgress = elapsed / anim.duration;
              displayParity = animProgress < 0.5 ? anim.previousParity : cell.parity;
            }
          }

          if (isAnimating) {
            const { elapsed, anim } = slideAnim;
            const prevColor = anim.previousParity === 0 ? palette.tileA : palette.tileB;
            const currColor = cell.parity === 0 ? palette.tileA : palette.tileB;
            const t = animProgress;

            // Fluffy pulse: 1.0 → 0.85 → 1.0
            const pulseAmount = Math.sin(t * Math.PI);
            const scale = 1 - 0.15 * pulseAmount;

            // Rounding during animation
            const animRadius = baseSize * 0.2 * pulseAmount;

            // Smooth color blend through midpoint
            let displayColor;
            if (t < 0.35) {
              displayColor = blendColors(prevColor, currColor, t / 0.35 * 0.5);
            } else if (t < 0.65) {
              displayColor = blendColors(prevColor, currColor, 0.5);
            } else {
              displayColor = blendColors(prevColor, currColor, 0.5 + (t - 0.65) / 0.35 * 0.5);
            }

            // Calculate scaled dimensions from center
            const scaledSize = baseSize * scale;
            const offsetX = (baseSize - scaledSize) / 2;
            const offsetY = (baseSize - scaledSize) / 2;

            // Draw scaled rounded cell
            ctx.fillStyle = displayColor;
            drawRoundedRectFill(x + offsetX, y + offsetY, scaledSize, scaledSize, [animRadius, animRadius, animRadius, animRadius]);
          } else {
            // No animation - draw simple rectangle
            ctx.fillStyle = displayParity === 0 ? palette.tileA : palette.tileB;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(baseSize), Math.ceil(baseSize));
          }

          if (cell.dot === 1) {
            let dotAlpha = 0.9;
            let dotScale = 1;
            if (dotAnim) {
              const t = Math.min(1, dotAnim.elapsed / dotAnim.anim.duration);
              dotAlpha = 0.9 * (1 - t);
              dotScale = 1 - t * 0.35;
              if (t >= 1) {
                cell.dot = 0;
                state.stats.dotsCleared += 1;
                updateAchievements();
                saveProgress();
              }
            }
            if (cell.dot === 1) {
              const dotRadius = Math.max(3, baseSize * 0.12) * dotScale;
              ctx.beginPath();
              ctx.arc(centerX, centerY, dotRadius, 0, Math.PI * 2);
              ctx.fillStyle = hexToRgba(palette.dot, dotAlpha);
              ctx.fill();
            }
          }

          if (cell.block === 1) {
            const blockSize = Math.max(6, baseSize * 0.22);
            ctx.strokeStyle = hexToRgba(palette.tileB, 0.7);
            ctx.lineWidth = Math.max(1.5, baseSize * 0.04);
            ctx.strokeRect(centerX - blockSize / 2, centerY - blockSize / 2, blockSize, blockSize);
          }

          if (cell.wind === 1) {
            const triSize = Math.max(8, baseSize * 0.26);
            const dir = cell.windDir % 4;
            const windColor = displayParity === 0 ? palette.tileB : palette.tileA;
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(dir * (Math.PI / 2));
            ctx.beginPath();
            ctx.moveTo(0, -triSize * 0.6);
            ctx.lineTo(triSize * 0.5, triSize * 0.4);
            ctx.lineTo(-triSize * 0.5, triSize * 0.4);
            ctx.closePath();
            ctx.fillStyle = hexToRgba(windColor, 0.75);
            ctx.fill();
            ctx.restore();
          }

          if (cell.echo === 1) {
            const echoR = Math.max(5, baseSize * 0.18);
            ctx.strokeStyle = hexToRgba(palette.tileB, 0.55);
            ctx.lineWidth = Math.max(1.2, baseSize * 0.03);
            ctx.beginPath();
            ctx.arc(centerX, centerY, echoR, 0, Math.PI * 2);
            ctx.stroke();
          }

          if (echoHitAnim) {
            const t = echoHitAnim.elapsed / echoHitAnim.anim.duration;
            const pulse = Math.sin(t * Math.PI);
            const inset = baseSize * (0.12 - 0.03 * pulse);
            const radius = baseSize * 0.18;
            ctx.fillStyle = hexToRgba(palette.tileB, 0.05 + pulse * 0.12);
            drawRoundedRectFill(x + inset, y + inset, baseSize - inset * 2, baseSize - inset * 2, [radius, radius, radius, radius]);
            ctx.strokeStyle = hexToRgba(palette.tileB, 0.18 + pulse * 0.5);
            ctx.lineWidth = Math.max(1.2, baseSize * 0.04);
            drawRoundedRectStroke(x + inset, y + inset, baseSize - inset * 2, baseSize - inset * 2, [radius, radius, radius, radius]);
          }

          if (echoFireAnim) {
            const t = echoFireAnim.elapsed / echoFireAnim.anim.duration;
            const pulse = Math.sin(t * Math.PI);
            const inset = Math.max(2, baseSize * (0.14 - 0.1 * t));
            const radius = baseSize * 0.18;
            ctx.fillStyle = hexToRgba(palette.tileB, 0.02 + (1 - t) * 0.08);
            drawRoundedRectFill(x + inset, y + inset, baseSize - inset * 2, baseSize - inset * 2, [radius, radius, radius, radius]);
            ctx.strokeStyle = hexToRgba(palette.tileB, 0.55 * (1 - t) + 0.1 * pulse);
            ctx.lineWidth = Math.max(1.1, baseSize * 0.04);
            drawRoundedRectStroke(x + inset, y + inset, baseSize - inset * 2, baseSize - inset * 2, [radius, radius, radius, radius]);
          }

          if (hintAnim) {
            const t = hintAnim.elapsed / hintAnim.anim.duration;
            const pulses = hintAnim.anim.pulses || 2;
            const wave = Math.sin(t * Math.PI * 2 * pulses);
            const intensity = Math.max(0, wave);
            const inset = baseSize * 0.08;
            const radius = baseSize * 0.18;
            ctx.fillStyle = hexToRgba(palette.dot, 0.08 + intensity * 0.18);
            drawRoundedRectFill(x + inset, y + inset, baseSize - inset * 2, baseSize - inset * 2, [radius, radius, radius, radius]);
            ctx.strokeStyle = hexToRgba(palette.dot, 0.2 + intensity * 0.7);
            ctx.lineWidth = Math.max(2, baseSize * 0.06);
            drawRoundedRectStroke(x + inset, y + inset, baseSize - inset * 2, baseSize - inset * 2, [radius, radius, radius, radius]);
          }
        }
      }
    }

    function renderInvalidOverlay() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.fillRect(layout.gridX, layout.gridY, layout.gridSize, layout.gridSize);
    }

    function renderMoveBorder(now) {
      const w = window.innerWidth;
      const level = getCurrentLevel();
      const palette = PALETTES[level.palette];

      const totalMoves = level.tapsRequired;
      if (totalMoves <= 0) return;

      const barHeight = Math.max(3, layout.cellSize * 0.06);
      const barY = layout.gridY + layout.gridSize + 14;
      const barX = layout.gridX;
      const barWidth = layout.gridSize;
      const gap = Math.min(8, Math.max(2, barHeight * 0.5));
      const totalGap = gap * (totalMoves - 1);
      const segmentWidth = Math.max(4, (barWidth - totalGap) / totalMoves);

      for (let i = 0; i < totalMoves; i++) {
        const remaining = i < state.tapsRemaining;
        let segAlpha = remaining ? 0.9 : 0.08;
        let scale = 1;

        let moveAnim = null;
        for (const anim of animations) {
          if (anim.type === 'move' && anim.index === i) {
            const elapsed = now - anim.startTime;
            if (elapsed >= 0 && elapsed < anim.duration) {
              moveAnim = { elapsed, anim };
              break;
            }
          }
        }

        if (moveAnim && !remaining) {
          const t = moveAnim.elapsed / moveAnim.anim.duration;
          const pulse = Math.sin(t * Math.PI);
          scale = 1 - 0.15 * pulse;
          segAlpha = segAlpha + (0.35 - segAlpha) * pulse;
        }

        const scaledWidth = segmentWidth * scale;
        const scaledHeight = barHeight * scale;
        const x = barX + i * (segmentWidth + gap) + (segmentWidth - scaledWidth) / 2;
        const y = barY + (barHeight - scaledHeight) / 2;

        ctx.fillStyle = hexToRgba(remaining ? palette.tileB : palette.tileA, segAlpha);
        ctx.fillRect(x, y, scaledWidth, scaledHeight);
      }

      // Show level number and grid size
      ctx.fillStyle = hexToRgba('#666666', 0.6);
      ctx.font = '14px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`Level ${state.currentLevel + 1}  •  ${level.gridSize}×${level.gridSize}`, w / 2, layout.gridY - 20);

      if (isInvalidState()) {
        const messageY = barY + barHeight + 18;
        ctx.fillStyle = hexToRgba('#e74c3c', 0.8);
        ctx.font = '16px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('Tap undo or reset to try again', w / 2, messageY);
      }
    }

    function renderControls(offsetY = 0, alpha = 1) {
      const level = getCurrentLevel();
      const palette = PALETTES[level.palette];
      const w = window.innerWidth;

      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.translate(0, offsetY);

      // Buttons
      const buttons = getControlButtons();
      ctx.font = '14px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textBaseline = 'middle';
      for (const btn of buttons) {
        ctx.fillStyle = hexToRgba(palette.tileB, 0.16);
        ctx.strokeStyle = hexToRgba(palette.tileB, 0.6);
        ctx.lineWidth = 1.5;
        fillRoundedRect(btn.x, btn.y, btn.w, btn.h, 12);
        strokeRoundedRect(btn.x, btn.y, btn.w, btn.h, 12);

        ctx.fillStyle = hexToRgba(palette.tileB, 0.95);
        ctx.textAlign = 'center';
        ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
      }

      ctx.restore();
    }

    // Level select pagination
    let levelSelectPage = 0;
    const levelsPerPage = 30;
    let achievementsPage = 0;
    const achievementsPerPage = 10;

    function getDailyCardRect() {
      const w = window.innerWidth;
      const cardW = Math.min(520, w * 0.82);
      const cardH = 70;
      const x = (w - cardW) / 2;
      const y = 110;
      return { x, y, w: cardW, h: cardH };
    }

    function getPackSelectLayout() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cols = 2;
      const rows = Math.ceil(PACKS.length / cols);
      const cellW = Math.min(w * 0.42, 220);
      const cellH = Math.min(h * 0.16, 100);
      const gridW = cols * cellW + (cols - 1) * 16;
      const gridH = rows * cellH + (rows - 1) * 16;
      const startX = (w - gridW) / 2;
      const dailyRect = getDailyCardRect();
      const startY = dailyRect.y + dailyRect.h + 30;

      return { cols, rows, cellW, cellH, startX, startY };
    }

    function getPackSelectHit(x, y) {
      const layout = getPackSelectLayout();
      for (let i = 0; i < PACKS.length; i++) {
        const row = Math.floor(i / layout.cols);
        const col = i % layout.cols;
        const rx = layout.startX + col * (layout.cellW + 16);
        const ry = layout.startY + row * (layout.cellH + 16);
        if (x >= rx && x <= rx + layout.cellW && y >= ry && y <= ry + layout.cellH) {
          return i;
        }
      }
      return null;
    }

    function renderPackSelect(alpha = 1) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.save();
      ctx.globalAlpha *= alpha;

      ctx.fillStyle = '#e7ebf0';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#4b5563';
      ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, sans-serif';

      ctx.font = '13px -apple-system, BlinkMacSystemFont, sans-serif';

      ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, sans-serif';

      ctx.textBaseline = 'top';

      ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';

      let iconX = dailyRect.x + dailyRect.w - 16 - (dailyProgress.total - 1) * 14;

      for (const mech of dailyProgress.mechanics) {
        const pack = PACK_DEFS.find(p => p.mechanic === mech);
        const palette = PALETTES[pack ? pack.palette : 0];
        const done = state.daily.mechanics[mech];
        ctx.beginPath();
        ctx.arc(iconX, iconY, 5, 0, Math.PI * 2);
        ctx.fillStyle = done ? palette.tileA : '#cbd5e1';
        ctx.fill();
        ctx.strokeStyle = done ? palette.tileB : '#94a3b8';
        ctx.lineWidth = 1;
        ctx.stroke();
        iconX += 14;
      }

      const achBtn = getAchievementsButtonRect();
      ctx.fillStyle = '#d1d5db';
      fillRoundedRect(achBtn.x, achBtn.y, achBtn.w, achBtn.h, 10);
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 1;
      strokeRoundedRect(achBtn.x, achBtn.y, achBtn.w, achBtn.h, 10);
      ctx.fillStyle = '#374151';
      ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Achievements', achBtn.x + achBtn.w / 2, achBtn.y + achBtn.h / 2 + 0.5);

      const layout = getPackSelectLayout();
      for (let i = 0; i < PACKS.length; i++) {
        const pack = PACKS[i];
        const row = Math.floor(i / layout.cols);
        const col = i % layout.cols;
        const x = layout.startX + col * (layout.cellW + 16);
        const y = layout.startY + row * (layout.cellH + 16);
        const palette = PALETTES[pack.palette];
        const completed = isPackCompleted(i);

        ctx.fillStyle = completed ? palette.tileA : palette.tileB;
        fillRoundedRect(x, y, layout.cellW, layout.cellH, 14);
        ctx.strokeStyle = hexToRgba(completed ? palette.tileB : palette.tileA, 0.6);
        ctx.lineWidth = 2;
        strokeRoundedRect(x, y, layout.cellW, layout.cellH, 14);

        ctx.fillStyle = getReadableTextColor(completed ? palette.tileA : palette.tileB);
        ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(pack.title, x + 14, y + 12);

        ctx.fillStyle = hexToRgba(getReadableTextColor(completed ? palette.tileA : palette.tileB), 0.7);
        ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(pack.subtitle, x + 14, y + 34);

        ctx.fillStyle = hexToRgba(getReadableTextColor(completed ? palette.tileA : palette.tileB), 0.6);
        ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(`${pack.levels.length} levels`, x + 14, y + layout.cellH - 20);

        if (completed) {
          ctx.strokeStyle = hexToRgba(getReadableTextColor(palette.tileA), 0.6);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + layout.cellW - 34, y + layout.cellH - 26);
          ctx.lineTo(x + layout.cellW - 26, y + layout.cellH - 18);
          ctx.lineTo(x + layout.cellW - 14, y + layout.cellH - 30);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function renderLevelSelect(offsetX = 0, alpha = 1) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cols = 5;
      const rows = 6;
      const cellSize = Math.min(w * 0.9 / cols, h * 0.72 / rows);
      const gridW = cols * cellSize;
      const gridH = rows * cellSize;
      const startX = (w - gridW) / 2;
      const startY = (h - gridH) / 2 + 20;

      const pack = getCurrentPack();
      const totalPages = Math.max(1, Math.ceil(pack.levels.length / levelsPerPage));
      levelSelectPage = Math.max(0, Math.min(levelSelectPage, totalPages - 1));
      const startLevel = levelSelectPage * levelsPerPage;
      const endLevel = Math.min(startLevel + levelsPerPage, pack.levels.length);

      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.translate(offsetX, 0);

      const background = '#e7ebf0';
      // Background
      let pagePalette = PALETTES[pack.levels[startLevel] ? pack.levels[startLevel].palette : pack.palette];
      const pageSolved = Array.from({ length: endLevel - startLevel }).every((_, idx) => isLevelCompleted(state.currentPack, startLevel + idx));
      ctx.fillStyle = pageSolved ? pagePalette.tileA : background;
      ctx.fillRect(0, 0, w, h);

      // Packs button
      const packBtn = getPackButtonRect();
      ctx.fillStyle = '#d1d5db';
      fillRoundedRect(packBtn.x, packBtn.y, packBtn.w, packBtn.h, 10);
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 1;
      strokeRoundedRect(packBtn.x, packBtn.y, packBtn.w, packBtn.h, 10);
      ctx.fillStyle = '#374151';
      ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Packs', packBtn.x + packBtn.w / 2, packBtn.y + packBtn.h / 2 + 0.5);

      const groupIndex = levelSelectPage;
      const groupStart = groupIndex * levelsPerPage + 1;
      const groupTitle = `${pack.title}  •  ${pack.subtitle}`;

      // Title with page info
      ctx.fillStyle = pageSolved ? pagePalette.tileB : '#4b5563';
      ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${groupTitle}`, w / 2, startY - 40);

      ctx.fillStyle = pageSolved ? hexToRgba(pagePalette.tileB, 0.7) : '#6b7280';
      ctx.font = '14px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(`Levels ${startLevel + 1}-${endLevel}`, w / 2, startY - 20);

      if (mechanicHas(pack.mechanic, 'dots')) {
        const badgeText = 'Fire On';
        ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
        const badgePadding = 10;
        const badgeWidth = ctx.measureText(badgeText).width + badgePadding * 2;
        const badgeHeight = 22;
        const badgeX = w / 2 - badgeWidth / 2;
        const badgeY = startY - 66;
        ctx.fillStyle = pageSolved ? pagePalette.tileB : '#111827';
        fillRoundedRect(badgeX, badgeY, badgeWidth, badgeHeight, 11);
        ctx.fillStyle = pageSolved ? pagePalette.tileA : '#f9fafb';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(badgeText, badgeX + badgeWidth / 2, badgeY + badgeHeight / 2 + 0.5);
      }

      // Level cells
      for (let i = startLevel; i < endLevel; i++) {
        const idx = i - startLevel;
        const row = Math.floor(idx / cols);
        const col = idx % cols;
        const x = startX + col * cellSize + 4;
        const y = startY + row * cellSize + 4;
        const size = cellSize - 8;

        const level = pack.levels[i];
        const completed = isLevelCompleted(state.currentPack, i);
        const palette = pageSolved ? pagePalette : PALETTES[level.palette];

        // Cell background
        const fill = completed ? palette.tileA : palette.tileB;
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, size, size);

        // Border for contrast
        ctx.strokeStyle = hexToRgba(completed ? palette.tileB : palette.tileA, 0.7);
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, size, size);

        // Level number
        ctx.fillStyle = getReadableTextColor(fill);
        ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), x + size / 2, y + size / 2);

        if (!completed) {
          // Small indicator for taps required
          ctx.fillStyle = hexToRgba(getReadableTextColor(fill), 0.7);
          ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.fillText(`${level.tapsRequired} tap${level.tapsRequired > 1 ? 's' : ''}`, x + size / 2, y + size - 10);
        } else {
          // Solved checkmark (small, bottom)
          ctx.strokeStyle = hexToRgba(getReadableTextColor(fill), 0.5);
          ctx.lineWidth = 1.4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x + size * 0.44, y + size * 0.80);
          ctx.lineTo(x + size * 0.48, y + size * 0.85);
          ctx.lineTo(x + size * 0.56, y + size * 0.77);
          ctx.stroke();
        }

        if (level.hasDots) {
          const dotR = 4;
          ctx.beginPath();
          ctx.arc(x + size - 10, y + 10, dotR, 0, Math.PI * 2);
          ctx.fillStyle = hexToRgba(palette.dot, 0.9);
          ctx.fill();
        }
      }

      // Page navigation arrows
      ctx.fillStyle = '#666666';
      ctx.font = 'bold 30px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textBaseline = 'middle';

      // Left arrow
      if (levelSelectPage > 0) {
        ctx.textAlign = 'left';
        ctx.fillText('‹', 20, h / 2);
      }

      // Right arrow
      if (levelSelectPage < totalPages - 1) {
        ctx.textAlign = 'right';
        ctx.fillText('›', w - 20, h / 2);
      }

      // Page dots
      const dotY = startY + gridH + 25;
      const dotSpacing = 15;
      const dotsStartX = w / 2 - (totalPages - 1) * dotSpacing / 2;
      for (let p = 0; p < totalPages; p++) {
        ctx.beginPath();
        ctx.arc(dotsStartX + p * dotSpacing, dotY, p === levelSelectPage ? 5 : 3, 0, Math.PI * 2);
        ctx.fillStyle = p === levelSelectPage ? '#666666' : '#cccccc';
        ctx.fill();
      }

      ctx.restore();
    }

    function getDailySelectLayout() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const pack = getDailyPack();
      const count = pack.levels.length;
      const cols = Math.min(4, count);
      const rows = Math.ceil(count / cols);
      const maxGridW = w * 0.8;
      const maxGridH = h * 0.5;
      const cellSize = Math.min(maxGridW / cols, maxGridH / rows);
      const gridW = cols * cellSize;
      const gridH = rows * cellSize;
      const startX = (w - gridW) / 2;
      const startY = (h - gridH) / 2 + 20;
      return { cols, rows, cellSize, gridW, gridH, startX, startY };
    }

    function getDailySelectHit(x, y) {
      const layout = getDailySelectLayout();
      const col = Math.floor((x - layout.startX) / layout.cellSize);
      const row = Math.floor((y - layout.startY) / layout.cellSize);
      if (col >= 0 && col < layout.cols && row >= 0 && row < layout.rows) {
        const idx = row * layout.cols + col;
        if (idx < getDailyPack().levels.length) {
          return idx;
        }
      }
      return null;
    }

        }

      ctx.restore();
    }

    function renderAchievements(alpha = 1) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.save();
      ctx.globalAlpha *= alpha;

      ctx.fillStyle = '#e7ebf0';
      ctx.fillRect(0, 0, w, h);

      const backBtn = getAchievementsBackRect();
      ctx.fillStyle = '#d1d5db';
      fillRoundedRect(backBtn.x, backBtn.y, backBtn.w, backBtn.h, 10);
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 1;
      strokeRoundedRect(backBtn.x, backBtn.y, backBtn.w, backBtn.h, 10);
      ctx.fillStyle = '#374151';
      ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Back', backBtn.x + backBtn.w / 2, backBtn.y + backBtn.h / 2 + 0.5);

      ctx.fillStyle = '#4b5563';
      ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Achievements', w / 2, 40);

      const progress = getDailyProgress();
      ctx.fillStyle = '#6b7280';
      ctx.font = '13px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(`Daily streak: ${state.daily.streak} day${state.daily.streak === 1 ? '' : 's'}`, w / 2, 68);
      ctx.fillText('Complete one level in each mechanic to keep the streak.', w / 2, 88);

      const mechRadius = 6;
      const mechGap = 18;
      const mechTotal = progress.total;
      let mechX = w / 2 - (mechTotal - 1) * mechGap / 2;
      const mechY = 112;
      for (const mech of progress.mechanics) {
        const pack = PACK_DEFS.find(p => p.mechanic === mech);
        const palette = PALETTES[pack ? pack.palette : 0];
        const done = state.daily.mechanics[mech];
        ctx.beginPath();
        ctx.arc(mechX, mechY, mechRadius, 0, Math.PI * 2);
        ctx.fillStyle = done ? palette.tileA : '#cbd5e1';
        ctx.fill();
        ctx.strokeStyle = done ? palette.tileB : '#94a3b8';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        mechX += mechGap;
      }

      ctx.fillStyle = '#6b7280';
      ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(`Today: ${progress.doneCount}/${progress.total} mechanics`, w / 2, 130);

      const totalPages = Math.max(1, Math.ceil(ACHIEVEMENTS.length / achievementsPerPage));
      achievementsPage = Math.max(0, Math.min(achievementsPage, totalPages - 1));
      const startIndex = achievementsPage * achievementsPerPage;
      const endIndex = Math.min(startIndex + achievementsPerPage, ACHIEVEMENTS.length);
      const list = ACHIEVEMENTS.slice(startIndex, endIndex);

      const cardW = Math.min(w * 0.86, 560);
      const cardH = 46;
      const cardGap = 10;
      const startX = (w - cardW) / 2;
      const startY = 160;

      list.forEach((ach, idx) => {
        const y = startY + idx * (cardH + cardGap);
        const unlocked = isAchievementUnlocked(ach.id);
        ctx.fillStyle = unlocked ? '#f9fafb' : '#d1d5db';
        fillRoundedRect(startX, y, cardW, cardH, 12);
        ctx.strokeStyle = unlocked ? '#cbd5f5' : '#9ca3af';
        ctx.lineWidth = 1;
        strokeRoundedRect(startX, y, cardW, cardH, 12);

        ctx.fillStyle = unlocked ? '#111827' : '#6b7280';
        ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(ach.title, startX + 12, y + 9);

        ctx.fillStyle = unlocked ? '#4b5563' : '#7b8794';
        ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(ach.desc, startX + 12, y + 26);

        if (unlocked) {
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 1.8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(startX + cardW - 26, y + 24);
          ctx.lineTo(startX + cardW - 20, y + 30);
          ctx.lineTo(startX + cardW - 12, y + 18);
          ctx.stroke();
        }
      });

      if (totalPages > 1) {
        ctx.fillStyle = '#666666';
        ctx.font = 'bold 30px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textBaseline = 'middle';

        if (achievementsPage > 0) {
          ctx.textAlign = 'left';
          ctx.fillText('‹', 20, h / 2);
        }
        if (achievementsPage < totalPages - 1) {
          ctx.textAlign = 'right';
          ctx.fillText('›', w - 20, h / 2);
        }

        const dotY = h - 28;
        const dotSpacing = 15;
        const dotsStartX = w / 2 - (totalPages - 1) * dotSpacing / 2;
        for (let p = 0; p < totalPages; p++) {
          ctx.beginPath();
          ctx.arc(dotsStartX + p * dotSpacing, dotY, p === achievementsPage ? 5 : 3, 0, Math.PI * 2);
          ctx.fillStyle = p === achievementsPage ? '#666666' : '#cccccc';
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function renderWinOverlay(now) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const elapsed = now - state.winTime;
      const alpha = Math.min(1, elapsed / 300) * 0.85;

      // Semi-transparent overlay
      ctx.fillStyle = hexToRgba('#ffffff', alpha);
      ctx.fillRect(0, 0, w, h);

      if (elapsed > 200) {
        const textAlpha = Math.min(1, (elapsed - 200) / 200);
        ctx.fillStyle = hexToRgba('#555555', textAlpha);
        ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const isLastLevel = state.currentLevel === getCurrentPack().levels.length - 1;
        const message = isLastLevel ? 'Congratulations!' : 'Level Complete!';
        ctx.fillText(message, w / 2, h / 2 - 20);

        ctx.font = '18px -apple-system, BlinkMacSystemFont, sans-serif';
        const subMessage = isLastLevel ? 'You finished all levels!' : 'Tap to continue';
        ctx.fillText(subMessage, w / 2, h / 2 + 20);
      }
    }

    // INITIALIZATION
    // ============================================

    function init() {
      // Setup canvas
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Load progress and always return to main menu on open
      loadProgress();
      if (!state.stats) state.stats = createDefaultStats();
      if (!state.daily) state.daily = createDefaultDaily();
      ensureDailyState();
      updateAchievements();
      loadLevel(0, 0);
      state.showingPackSelect = true;
      state.showingLevelSelect = false;
      state.showingDailySelect = false;
      state.playingDaily = false;
      levelSelectPage = 0;

      // Input events
      canvas.addEventListener('pointerdown', handlePointerDown);
      canvas.addEventListener('pointerup', handlePointerUp);
      canvas.addEventListener('pointercancel', () => { pointerStart = null; });

      // Prevent context menu on long press
      canvas.addEventListener('contextmenu', e => e.preventDefault());

      // Save on visibility change and before unload
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          saveProgress();
        }
      });
      window.addEventListener('beforeunload', saveProgress);

      // Start render loop
      requestAnimationFrame(render);
    }

    init();
  </script>
</body>
</html>
