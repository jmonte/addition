<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Parity</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // ============================================
    // PARITY PUZZLE GAME
    // Like Bicolor - make all cells match the background
    // ============================================

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Color Palettes - muted, calm colors like Bicolor
    // tileA = target color (matches background), tileB = contrasting color
    const PALETTES = [
      { tileA: '#2C3E50', tileB: '#ECF0F1', dot: '#E74C3C', bg: '#2C3E50' },  // Dark blue-gray / Off-white
      { tileA: '#34495E', tileB: '#F5F5F5', dot: '#E67E22', bg: '#34495E' },  // Slate / White
      { tileA: '#1ABC9C', tileB: '#2C3E50', dot: '#F1C40F', bg: '#1ABC9C' },  // Teal / Dark
      { tileA: '#ECF0F1', tileB: '#3498DB', dot: '#E74C3C', bg: '#ECF0F1' },  // Off-white / Blue
      { tileA: '#9B59B6', tileB: '#ECF0F1', dot: '#F1C40F', bg: '#9B59B6' },  // Purple / White
      { tileA: '#2C3E50', tileB: '#1ABC9C', dot: '#E74C3C', bg: '#2C3E50' },  // Dark / Teal
      { tileA: '#E8E8E8', tileB: '#333333', dot: '#FF6B6B', bg: '#E8E8E8' },  // Light gray / Dark gray
      { tileA: '#3498DB', tileB: '#ECF0F1', dot: '#F39C12', bg: '#3498DB' },  // Blue / White
      { tileA: '#27AE60', tileB: '#2C3E50', dot: '#F1C40F', bg: '#27AE60' },  // Green / Dark
      { tileA: '#F5F5F5', tileB: '#E74C3C', dot: '#3498DB', bg: '#F5F5F5' },  // White / Red
    ];

    // Build puzzles from fixed solutions
    function buildGridFromSolution(gridSize, solution, options = {}) {
      const grid = [];
      for (let r = 0; r < gridSize; r++) {
        grid[r] = [];
        for (let c = 0; c < gridSize; c++) {
          grid[r][c] = { parity: 0, dot: 0, block: 0, echo: 0, wind: 0, windDir: 0 };
        }
      }

      const blockMask = options.blocks || null;
      if (blockMask) {
        for (const block of blockMask) {
          grid[block.row][block.col].block = 1;
        }
      }

      const echoCells = options.echoCells || null;
      let echoState = null;
      if (echoCells) {
        for (const cell of echoCells) {
          grid[cell.row][cell.col].echo = 1;
        }
        if (options.mechanic === 'echo') {
          const remaining = new Set(echoCells.map(cell => `${cell.row},${cell.col}`));
          echoState = { remaining, consumeGrid: false };
        }
      }

      const windCells = options.windCells || null;
      if (windCells) {
        for (const cell of windCells) {
          grid[cell.row][cell.col].wind = 1;
          grid[cell.row][cell.col].windDir = cell.dir;
        }
      }

      for (const tap of solution) {
        applyTapToGrid(grid, tap.row, tap.col, gridSize, options.mechanic || 'classic', blockMask, echoState);
      }

      if (windCells) {
        for (const cell of windCells) {
          grid[cell.row][cell.col].wind = 1;
          grid[cell.row][cell.col].windDir = cell.dir;
        }
      }

      return grid;
    }

    function createSeededRandom(seed) {
      return function() {
        seed = Math.sin(seed) * 10000;
        return seed - Math.floor(seed);
      };
    }

    function mechanicHas(mechanic, token) {
      if (!mechanic) return false;
      if (mechanic === token) return true;
      if (mechanic === 'classic') return token === 'classic';
      return mechanic.split('+').includes(token);
    }

    function scorePuzzleInterestingness(grid, solution, gridSize) {
      let score = 0;

      let parity1Count = 0;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (grid[r][c].parity === 1) {
            parity1Count++;
          }
        }
      }

      const totalCells = gridSize * gridSize;
      const parity1Ratio = parity1Count / totalCells;
      const optimalRatio = 0.45;
      const ratioScore = 18 * (1 - Math.abs(parity1Ratio - optimalRatio) / optimalRatio);
      score += Math.max(0, ratioScore);

      let solidBlocks = 0;
      for (let r = 0; r < gridSize - 1; r++) {
        for (let c = 0; c < gridSize - 1; c++) {
          const p00 = grid[r][c].parity;
          const p01 = grid[r][c + 1].parity;
          const p10 = grid[r + 1][c].parity;
          const p11 = grid[r + 1][c + 1].parity;
          if (p00 === p01 && p01 === p10 && p10 === p11) {
            solidBlocks++;
          }
        }
      }
      const maxBlocks = (gridSize - 1) * (gridSize - 1);
      const solidPenalty = 12 * (solidBlocks / Math.max(1, maxBlocks));
      score += 12 - solidPenalty;

      let adjacentPairs = 0;
      let alignedPairs = 0;
      for (let i = 0; i < solution.length; i++) {
        for (let j = i + 1; j < solution.length; j++) {
          const dr = Math.abs(solution[i].row - solution[j].row);
          const dc = Math.abs(solution[i].col - solution[j].col);
          if (dr <= 1 && dc <= 1) adjacentPairs++;
          if (solution[i].row === solution[j].row || solution[i].col === solution[j].col) alignedPairs++;
        }
      }
      const maxPairs = solution.length * (solution.length - 1) / 2;
      score += 18 * (1 - adjacentPairs / Math.max(1, maxPairs));
      score += 18 * (1 - alignedPairs / Math.max(1, maxPairs));

      const toggleCounts = buildToggleCounts(gridSize, solution);

      let multiToggleCells = 0;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (toggleCounts[r][c] >= 2) multiToggleCells++;
        }
      }
      score += 30 * (multiToggleCells / totalCells);

      return score;
    }

    function buildToggleCounts(gridSize, solution) {
      const counts = [];
      for (let r = 0; r < gridSize; r++) {
        counts[r] = [];
        for (let c = 0; c < gridSize; c++) {
          counts[r][c] = 0;
        }
      }

      for (const tap of solution) {
        for (let c = 0; c < gridSize; c++) {
          counts[tap.row][c]++;
        }
        for (let r = 0; r < gridSize; r++) {
          if (r !== tap.row) {
            counts[r][tap.col]++;
          }
        }
      }

      return counts;
    }

    function buildToggleCountsForMechanic(gridSize, solution, mechanic, blocks = null, winds = null) {
      const hasBlocks = mechanicHas(mechanic, 'blocks');
      const hasWind = mechanicHas(mechanic, 'wind');

      if (!hasBlocks && !hasWind) {
        return buildToggleCounts(gridSize, solution);
      }

      const counts = [];
      const grid = [];
      for (let r = 0; r < gridSize; r++) {
        counts[r] = [];
        grid[r] = [];
        for (let c = 0; c < gridSize; c++) {
          counts[r][c] = 0;
          grid[r][c] = { block: 0, wind: 0, windDir: 0 };
        }
      }

      if (blocks) {
        for (const block of blocks) {
          grid[block.row][block.col].block = 1;
        }
      }

      if (winds) {
        for (const cell of winds) {
          grid[cell.row][cell.col].wind = 1;
          grid[cell.row][cell.col].windDir = cell.dir;
        }
      }

      const isBlocked = (r, c) => hasBlocks && grid[r][c].block === 1;

      for (const tap of solution) {
        if (hasBlocks && isBlocked(tap.row, tap.col)) {
          continue;
        }

        const windQueue = [];
        const queueWind = (r, c) => {
          if (!hasWind) return;
          if (grid[r][c].wind !== 1) return;
          const dir = grid[r][c].windDir;
          grid[r][c].wind = 0;
          grid[r][c].windDir = 0;
          windQueue.push({ row: r, col: c, dir });
        };

        const toggleCell = (r, c) => {
          counts[r][c] += 1;
          queueWind(r, c);
        };

        const processWindQueue = () => {
          if (!hasWind) return;
          while (windQueue.length) {
            const wind = windQueue.shift();
            const delta = DIR_VECTORS[wind.dir % 4] || DIR_VECTORS[0];
            let r = wind.row + delta.dr;
            let c = wind.col + delta.dc;
            while (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
              if (hasBlocks && isBlocked(r, c)) {
                break;
              }
              toggleCell(r, c);
              r += delta.dr;
              c += delta.dc;
            }
          }
        };

        if (hasWind && grid[tap.row][tap.col].wind === 1) {
          toggleCell(tap.row, tap.col);
          processWindQueue();
          continue;
        }

        toggleCell(tap.row, tap.col);

        for (let c = tap.col - 1; c >= 0; c--) {
          if (isBlocked(tap.row, c)) {
            break;
          }
          toggleCell(tap.row, c);
        }

        for (let c = tap.col + 1; c < gridSize; c++) {
          if (isBlocked(tap.row, c)) {
            break;
          }
          toggleCell(tap.row, c);
        }

        for (let r = tap.row - 1; r >= 0; r--) {
          if (isBlocked(r, tap.col)) {
            break;
          }
          toggleCell(r, tap.col);
        }

        for (let r = tap.row + 1; r < gridSize; r++) {
          if (isBlocked(r, tap.col)) {
            break;
          }
          toggleCell(r, tap.col);
        }

        processWindQueue();
      }

      return counts;
    }

    function verifyPuzzleSolution(grid, gridSize, solution, mechanic, blocks = null, winds = null) {
      const counts = buildToggleCountsForMechanic(gridSize, solution, mechanic, blocks, winds);
      const hasDots = mechanicHas(mechanic, 'dots');
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const cell = grid[r][c];
          const toggles = counts[r][c] % 2;
          if ((cell.parity + toggles) % 2 !== 0) {
            return false;
          }
          if (hasDots && cell.dot === 1 && counts[r][c] === 0) {
            return false;
          }
        }
      }
      return true;
    }

    function buildBlockMask(gridSize, seed, count, forbiddenKeys = new Set()) {
      const random = createSeededRandom(seed);
      const blocks = [];
      const used = new Set(forbiddenKeys);
      let attempts = 0;

      while (blocks.length < count && attempts < count * 40) {
        const r = Math.floor(random() * gridSize);
        const c = Math.floor(random() * gridSize);
        const key = `${r},${c}`;
        if (!used.has(key)) {
          used.add(key);
          blocks.push({ row: r, col: c });
        }
        attempts++;
      }

      return blocks;
    }

    function buildEchoLayout(gridSize, solution, seed) {
      const random = createSeededRandom(seed);
      const solutionKeys = new Set(solution.map(tap => `${tap.row},${tap.col}`));
      const solutionRows = new Set(solution.map(tap => tap.row));
      const solutionCols = new Set(solution.map(tap => tap.col));

      const targetCount = Math.max(2, Math.min(gridSize + 1, Math.floor(gridSize * 0.6)));
      const maxCount = Math.min(gridSize + 2, gridSize * gridSize - solution.length);

      const candidates = [];
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const key = `${r},${c}`;
          if (solutionKeys.has(key)) continue;
          if (solutionRows.has(r) || solutionCols.has(c)) {
            candidates.push({ row: r, col: c });
          }
        }
      }

      if (candidates.length === 0) return [];

      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }

      const used = new Set();
      const echoes = [];

      const findSecondary = (primary) => {
        const secondary = [];
        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            const key = `${r},${c}`;
            if (solutionKeys.has(key) || used.has(key)) continue;
            if (solutionRows.has(r) || solutionCols.has(c)) continue;
            if (r === primary.row || c === primary.col) {
              secondary.push({ row: r, col: c });
            }
          }
        }
        if (secondary.length === 0) return null;
        return secondary[Math.floor(random() * secondary.length)];
      };

      const chainTarget = Math.max(1, Math.floor(targetCount * 0.3));
      let chains = 0;
      for (const primary of candidates) {
        if (chains >= chainTarget) break;
        const key = `${primary.row},${primary.col}`;
        if (used.has(key)) continue;
        const secondary = findSecondary(primary);
        if (!secondary) continue;
        const secondaryKey = `${secondary.row},${secondary.col}`;
        used.add(key);
        used.add(secondaryKey);
        echoes.push(primary, secondary);
        chains++;
      }

      for (const candidate of candidates) {
        if (echoes.length >= targetCount) break;
        const key = `${candidate.row},${candidate.col}`;
        if (used.has(key)) continue;
        used.add(key);
        echoes.push(candidate);
      }

      const hasEchoInRowCol = (tap) => {
        return echoes.some(cell => cell.row === tap.row || cell.col === tap.col);
      };

      for (const tap of solution) {
        if (hasEchoInRowCol(tap)) continue;
        const options = [];
        for (let r = 0; r < gridSize; r++) {
          const key = `${r},${tap.col}`;
          if (!solutionKeys.has(key) && !used.has(key)) {
            options.push({ row: r, col: tap.col });
          }
        }
        for (let c = 0; c < gridSize; c++) {
          const key = `${tap.row},${c}`;
          if (!solutionKeys.has(key) && !used.has(key)) {
            options.push({ row: tap.row, col: c });
          }
        }
        if (options.length > 0) {
          const pick = options[Math.floor(random() * options.length)];
          const key = `${pick.row},${pick.col}`;
          used.add(key);
          echoes.push(pick);
        }
      }

      if (echoes.length > maxCount) {
        const required = new Set();
        for (const tap of solution) {
          const match = echoes.find(cell => cell.row === tap.row || cell.col === tap.col);
          if (match) required.add(`${match.row},${match.col}`);
        }
        const secondaryCandidates = echoes.filter(cell => {
          if (solutionRows.has(cell.row) || solutionCols.has(cell.col)) return false;
          return echoes.some(primary => (solutionRows.has(primary.row) || solutionCols.has(primary.col)) &&
            (primary.row === cell.row || primary.col === cell.col));
        });
        if (secondaryCandidates.length > 0) {
          const keep = secondaryCandidates[Math.floor(random() * secondaryCandidates.length)];
          required.add(`${keep.row},${keep.col}`);
        }

        const removable = echoes.filter(cell => !required.has(`${cell.row},${cell.col}`));
        for (let i = removable.length - 1; i >= 0 && echoes.length > maxCount; i--) {
          const key = `${removable[i].row},${removable[i].col}`;
          used.delete(key);
          const idx = echoes.findIndex(cell => cell.row === removable[i].row && cell.col === removable[i].col);
          if (idx !== -1) echoes.splice(idx, 1);
        }
      }

      return echoes;
    }

    function buildWindLayout(gridSize, solution, seed) {
      const random = createSeededRandom(seed);
      const solutionKeys = new Set(solution.map(tap => `${tap.row},${tap.col}`));
      const solutionList = solution.slice();
      const candidates = [];

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const key = `${r},${c}`;
          if (solutionKeys.has(key)) continue;
          candidates.push({ row: r, col: c });
        }
      }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }

      shuffle(solutionList);
      shuffle(candidates);

      const targetCount = Math.max(2, Math.min(gridSize + 1, Math.floor(gridSize * 0.6)));
      const winds = [];
      const used = new Set();

      const validWindDirs = (row, col) => {
        const dirs = [];
        if (row > 0) dirs.push(0);
        if (col < gridSize - 1) dirs.push(1);
        if (row < gridSize - 1) dirs.push(2);
        if (col > 0) dirs.push(3);
        return dirs;
      };

      const pickWindDir = (row, col) => {
        const dirs = validWindDirs(row, col);
        if (dirs.length === 0) return null;
        return dirs[Math.floor(random() * dirs.length)];
      };

      if (solutionList.length > 0) {
        const tap = solutionList[0];
        const key = `${tap.row},${tap.col}`;
        const dir = pickWindDir(tap.row, tap.col);
        if (dir !== null) {
          used.add(key);
          winds.push({ row: tap.row, col: tap.col, dir });
        }
      }

      const pool = solutionList.concat(candidates);
      for (const cell of pool) {
        if (winds.length >= targetCount) break;
        const key = `${cell.row},${cell.col}`;
        if (used.has(key)) continue;
        const dir = pickWindDir(cell.row, cell.col);
        if (dir === null) continue;
        used.add(key);
        winds.push({ row: cell.row, col: cell.col, dir });
      }

      if (winds.length > 1) {
        const dirSet = new Set(winds.map(cell => cell.dir));
        if (dirSet.size < 2) {
          const altDirs = validWindDirs(winds[1].row, winds[1].col).filter(d => d !== winds[0].dir);
          if (altDirs.length > 0) {
            winds[1].dir = altDirs[Math.floor(random() * altDirs.length)];
          }
        }
      }

      return winds;
    }

    function analyzeEchoLayout(gridSize, solution, echoes) {
      const solutionRows = new Set(solution.map(tap => tap.row));
      const solutionCols = new Set(solution.map(tap => tap.col));
      let tapsWithEcho = 0;
      for (const tap of solution) {
        if (echoes.some(cell => cell.row === tap.row || cell.col === tap.col)) {
          tapsWithEcho++;
        }
      }

      const primary = echoes.filter(cell => solutionRows.has(cell.row) || solutionCols.has(cell.col));
      const secondary = echoes.filter(cell => !solutionRows.has(cell.row) && !solutionCols.has(cell.col))
        .filter(cell => primary.some(p => p.row === cell.row || p.col === cell.col));

      return {
        coverage: solution.length ? tapsWithEcho / solution.length : 0,
        chainCount: secondary.length,
      };
    }

    function applyTapToGrid(grid, row, col, gridSize, mechanic, blockMask, echoState) {
      const hasBlocks = mechanicHas(mechanic, 'blocks');
      const hasWind = mechanicHas(mechanic, 'wind');
      const hasEcho = mechanicHas(mechanic, 'echo');
      const isBlocked = (r, c) => {
        if (!blockMask) return false;
        return blockMask.some(cell => cell.row === r && cell.col === c);
      };

      const isEcho = (r, c) => {
        if (!hasEcho) return false;
        if (echoState) {
          return echoState.remaining.has(`${r},${c}`);
        }
        return grid[r][c].echo === 1;
      };

      if (hasBlocks && isBlocked(row, col)) {
        return;
      }

      const windQueue = [];
      const queueWind = (r, c) => {
        if (!hasWind) return;
        if (grid[r][c].wind !== 1) return;
        const dir = grid[r][c].windDir;
        grid[r][c].wind = 0;
        grid[r][c].windDir = 0;
        windQueue.push({ row: r, col: c, dir });
      };

      const toggleCell = (r, c) => {
        grid[r][c].parity = (grid[r][c].parity + 1) % 2;
        queueWind(r, c);
      };

      const processWindQueue = () => {
        if (!hasWind) return;
        const deltas = [
          { dr: -1, dc: 0 },
          { dr: 0, dc: 1 },
          { dr: 1, dc: 0 },
          { dr: 0, dc: -1 },
        ];
        while (windQueue.length) {
          const wind = windQueue.shift();
          const delta = deltas[wind.dir] || deltas[0];
          let r = wind.row + delta.dr;
          let c = wind.col + delta.dc;
          while (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
            if (hasBlocks && isBlocked(r, c)) {
              break;
            }
            toggleCell(r, c);
            r += delta.dr;
            c += delta.dc;
          }
        }
      };

      const triggeredEcho = new Set();
      const tapQueue = [{ row, col }];

      while (tapQueue.length) {
        const tap = tapQueue.shift();

        if (hasBlocks && isBlocked(tap.row, tap.col)) {
          continue;
        }

        const maybeQueueEcho = (r, c) => {
          if (!hasEcho) return;
          if (!isEcho(r, c)) return;
          const key = `${r},${c}`;
          if (triggeredEcho.has(key)) return;
          triggeredEcho.add(key);
          if (echoState) {
            echoState.remaining.delete(key);
            if (echoState.consumeGrid) {
              grid[r][c].echo = 0;
            }
          } else {
            grid[r][c].echo = 0;
          }
          tapQueue.push({ row: r, col: c });
        };

        if (hasWind && grid[tap.row][tap.col].wind === 1) {
          toggleCell(tap.row, tap.col);
          processWindQueue();
          continue;
        }

        const toggleRowWithBlocks = () => {
          toggleCell(tap.row, tap.col);
          maybeQueueEcho(tap.row, tap.col);

          for (let c = tap.col - 1; c >= 0; c--) {
            if (hasBlocks && isBlocked(tap.row, c)) {
              break;
            }
            toggleCell(tap.row, c);
            maybeQueueEcho(tap.row, c);
          }

          for (let c = tap.col + 1; c < gridSize; c++) {
            if (hasBlocks && isBlocked(tap.row, c)) {
              break;
            }
            toggleCell(tap.row, c);
            maybeQueueEcho(tap.row, c);
          }
        };

        const toggleColumnWithBlocks = () => {
          for (let r = tap.row - 1; r >= 0; r--) {
            if (hasBlocks && isBlocked(r, tap.col)) {
              break;
            }
            toggleCell(r, tap.col);
            maybeQueueEcho(r, tap.col);
          }

          for (let r = tap.row + 1; r < gridSize; r++) {
            if (hasBlocks && isBlocked(r, tap.col)) {
              break;
            }
            toggleCell(r, tap.col);
            maybeQueueEcho(r, tap.col);
          }
        };

        toggleRowWithBlocks();
        toggleColumnWithBlocks();
        processWindQueue();
      }
    }

    function applyDotsToGrid(grid, gridSize, solution, seed, mechanic = 'dots', blocks = null, winds = null) {
      const random = createSeededRandom(seed);
      const toggleCounts = buildToggleCountsForMechanic(gridSize, solution, mechanic, blocks, winds);
      const candidates = [];
      const parityZero = [];
      const parityOne = [];

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (toggleCounts[r][c] > 0) {
            const entry = { row: r, col: c };
            candidates.push(entry);
            if (grid[r][c].parity === 0) {
              parityZero.push(entry);
            } else {
              parityOne.push(entry);
            }
          }
        }
      }

      if (candidates.length === 0) return 0;

      const maxDots = Math.min(candidates.length, Math.floor(gridSize * gridSize * 0.5));
      let dotCount = Math.floor(gridSize * gridSize * 0.18 + solution.length * 0.6);
      dotCount = Math.max(3, Math.min(dotCount, maxDots));

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }

      shuffle(parityZero);
      shuffle(parityOne);

      let zeroTarget = Math.min(parityZero.length, Math.round(dotCount * 0.6));
      let oneTarget = Math.min(parityOne.length, dotCount - zeroTarget);
      if (zeroTarget + oneTarget < dotCount) {
        const remaining = dotCount - (zeroTarget + oneTarget);
        const extraZero = Math.min(parityZero.length - zeroTarget, remaining);
        zeroTarget += extraZero;
        oneTarget = Math.min(parityOne.length, dotCount - zeroTarget);
      }

      const chosen = [];
      chosen.push(...parityZero.slice(0, zeroTarget));
      chosen.push(...parityOne.slice(0, oneTarget));

      while (chosen.length < dotCount && candidates.length > chosen.length) {
        const idx = Math.floor(random() * candidates.length);
        const cell = candidates[idx];
        if (!chosen.some(c => c.row === cell.row && c.col === cell.col)) {
          chosen.push(cell);
        }
      }

      for (const cell of chosen) {
        grid[cell.row][cell.col].dot = 1;
      }

      return chosen.length;
    }

    function gridSignatureBigInt(grid) {
      let bits = 0n;
      let idx = 0n;
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[r].length; c++) {
          if (grid[r][c].parity === 1) {
            bits |= (1n << idx);
          }
          idx++;
        }
      }
      return bits;
    }

    function blockSignatureBigInt(blocks, gridSize) {
      let bits = 0n;
      for (const block of blocks) {
        const idx = BigInt(block.row * gridSize + block.col);
        bits |= (1n << idx);
      }
      return bits;
    }

    function echoSignatureBigInt(echoes, gridSize) {
      let bits = 0n;
      for (const cell of echoes) {
        const idx = BigInt(cell.row * gridSize + cell.col);
        bits |= (1n << idx);
      }
      return bits;
    }

    function windSignatureKey(winds, gridSize) {
      const dirs = [0n, 0n, 0n, 0n];
      for (const cell of winds) {
        const idx = BigInt(cell.row * gridSize + cell.col);
        const dir = cell.dir % 4;
        dirs[dir] |= (1n << idx);
      }
      return dirs.join('|');
    }

    function canonicalSignature(grid) {
      const n = grid.length;
      const parity = (r, c) => grid[r][c].parity;
      const transforms = [
        (r, c, size) => [r, c],
        (r, c, size) => [c, size - 1 - r],
        (r, c, size) => [size - 1 - r, size - 1 - c],
        (r, c, size) => [size - 1 - c, r],
        (r, c, size) => [r, size - 1 - c],
        (r, c, size) => [size - 1 - r, c],
        (r, c, size) => [c, r],
        (r, c, size) => [size - 1 - c, size - 1 - r],
      ];

      let best = null;
      for (const transform of transforms) {
        let signature = '';
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            const [or, oc] = transform(r, c, n);
            signature += parity(or, oc);
          }
        }
        if (best === null || signature < best) {
          best = signature;
        }
      }
      return best || '';
    }

    const DIR_VECTORS = [
      { dr: -1, dc: 0 },
      { dr: 0, dc: 1 },
      { dr: 1, dc: 0 },
      { dr: 0, dc: -1 },
    ];

    function dirFromDelta(dr, dc) {
      if (dr === -1 && dc === 0) return 0;
      if (dr === 0 && dc === 1) return 1;
      if (dr === 1 && dc === 0) return 2;
      if (dr === 0 && dc === -1) return 3;
      return 0;
    }

    function canonicalPuzzleSignature(grid) {
      const n = grid.length;
      const transforms = [
        (r, c, size) => [r, c],
        (r, c, size) => [c, size - 1 - r],
        (r, c, size) => [size - 1 - r, size - 1 - c],
        (r, c, size) => [size - 1 - c, r],
        (r, c, size) => [r, size - 1 - c],
        (r, c, size) => [size - 1 - r, c],
        (r, c, size) => [c, r],
        (r, c, size) => [size - 1 - c, size - 1 - r],
      ];

      const anchor = n > 2 ? 1 : 0;
      let best = null;
      for (const transform of transforms) {
        const parity = new Array(n * n);
        const dots = new Array(n * n);
        const blocks = new Array(n * n);
        const echoes = new Array(n * n);
        const winds = new Array(n * n);

        const dirMap = DIR_VECTORS.map(({ dr, dc }) => {
          const [r1, c1] = transform(anchor, anchor, n);
          const [r2, c2] = transform(anchor + dr, anchor + dc, n);
          return dirFromDelta(r2 - r1, c2 - c1);
        });

        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            const [tr, tc] = transform(r, c, n);
            const idx = tr * n + tc;
            const cell = grid[r][c];
            parity[idx] = cell.parity === 1 ? '1' : '0';
            dots[idx] = cell.dot === 1 ? '1' : '0';
            blocks[idx] = cell.block === 1 ? '1' : '0';
            echoes[idx] = cell.echo === 1 ? '1' : '0';
            if (cell.wind === 1) {
              const mapped = dirMap[cell.windDir % 4];
              winds[idx] = String(mapped);
            } else {
              winds[idx] = 'n';
            }
          }
        }

        const signature = `${parity.join('')}|${dots.join('')}|${blocks.join('')}|${echoes.join('')}|${winds.join('')}`;
        if (best === null || signature < best) {
          best = signature;
        }
      }
      return best || '';
    }

    function buildTrivialSignatureSets(maxTaps) {
      const setsBySize = {};
      for (let gridSize = 3; gridSize <= 7; gridSize++) {
        const sets = Array.from({ length: maxTaps + 1 }, () => new Set());
        const total = gridSize * gridSize;

        if (maxTaps >= 1) {
          for (let i = 0; i < total; i++) {
            const taps = [{ row: Math.floor(i / gridSize), col: i % gridSize }];
            const grid = buildGridFromSolution(gridSize, taps);
            sets[1].add(gridSignatureBigInt(grid));
          }
        }

        if (maxTaps >= 2) {
          for (let i = 0; i < total - 1; i++) {
            for (let j = i + 1; j < total; j++) {
              const taps = [
                { row: Math.floor(i / gridSize), col: i % gridSize },
                { row: Math.floor(j / gridSize), col: j % gridSize },
              ];
              const grid = buildGridFromSolution(gridSize, taps);
              sets[2].add(gridSignatureBigInt(grid));
            }
          }
        }

        if (maxTaps >= 3) {
          for (let i = 0; i < total - 2; i++) {
            for (let j = i + 1; j < total - 1; j++) {
              for (let k = j + 1; k < total; k++) {

                  { row: Math.floor(j / gridSize), col: j % gridSize },
                  { row: Math.floor(k / gridSize), col: k % gridSize },
                ];
                const grid = buildGridFromSolution(gridSize, taps);
                sets[3].add(gridSignatureBigInt(grid));
              }
            }
          }
        }

        setsBySize[gridSize] = sets;
      }
      return setsBySize;
    }

    const TRIVIAL_SETS = buildTrivialSignatureSets(3);

    function hasTrivialAlternative(gridSize, signature, tapsRequired) {
      const maxCheck = Math.min(3, tapsRequired - 1);
      if (maxCheck < 1) return false;
      const sets = TRIVIAL_SETS[gridSize];
      for (let k = 1; k <= maxCheck; k++) {
        if (sets[k].has(signature)) {
          return true;

      return false;
    }

    const placementStrategies = {

    function generateEchoPuzzle(gridSize, taps, seed, usedSignatures) {
      const random = createSeededRandom(seed);
      const strategyNames = Object.keys(placementStrategies);
      let best = null;
      const attempts = 240;

      for (let i = 0; i < attempts; i++) {
        const strategy = strategyNames[i % strategyNames.length];
        const solution = placementStrategies[strategy](random, gridSize, taps);
        if (solution.length !== taps) continue;

        const echoes = buildEchoLayout(gridSize, solution, seed + i * 733);
        if (echoes.length === 0) continue;

        const analysis = analyzeEchoLayout(gridSize, solution, echoes);
        const minCoverage = gridSize <= 3 ? 0.5 : 0.6;
        if (analysis.coverage < minCoverage) continue;
        if (gridSize >= 4 && analysis.chainCount === 0 && i < attempts * 0.7) continue;

        const grid = buildGridFromSolution(gridSize, solution, { mechanic: 'echo', echoCells: echoes });
        const gridNoEcho = buildGridFromSolution(gridSize, solution, { mechanic: 'classic' });
        if (gridSignatureBigInt(grid) === gridSignatureBigInt(gridNoEcho)) continue;
        const signature = canonicalPuzzleSignature(grid);
        if (usedSignatures.has(signature)) continue;
        const rawSignature = gridSignatureBigInt(grid);
        if (hasTrivialAlternative(gridSize, rawSignature, taps)) continue;

        let score = scorePuzzleInterestingness(grid, solution, gridSize);
        score += analysis.coverage * 18;
        score += Math.min(10, analysis.chainCount * 2);
        if (!best || score > best.score) {
          best = { grid, solution, score, signature, echoes };
        }
      }

      if (!best) return null;
      usedSignatures.add(best.signature);
      return { grid: best.grid, solution: best.solution, tapsRequired: taps, echoes: best.echoes || [] };
    }

    function generateComboPuzzle(gridSize, taps, seed, usedSignatures, mechanic) {
      const random = createSeededRandom(seed);

      let best = null;
      const attempts = 240;
      const hasBlocks = mechanicHas(mechanic, 'blocks');
      const hasWind = mechanicHas(mechanic, 'wind');
      const hasDots = mechanicHas(mechanic, 'dots');

      for (let i = 0; i < attempts; i++) {
        const strategy = strategyNames[i % strategyNames.length];
        let blocks = null;
        if (hasBlocks) {
          const blockCount = Math.max(1, Math.min(gridSize + 1, Math.floor(gridSize * 0.7)));
          const blockSeed = seed + i * 97;
          blocks = buildBlockMask(gridSize, blockSeed, blockCount);
        }

        const solution = placementStrategies[strategy](random, gridSize, taps);
        if (solution.length !== taps) continue;
        if (blocks && solution.some(tap => blocks.some(block => block.row === tap.row && block.col === tap.col))) {

        }

        const winds = hasWind ? buildWindLayout(gridSize, solution, seed + i * 619) : null;
        if (hasWind && (!winds || winds.length === 0)) continue;

        if (hasDots) {

    function generatePackLevels(packIndex, packDef) {
      const levels = [];
      const usedSignatures = new Set();
      const difficulties = BASE_DIFFICULTIES.slice(0, PACK_LEVEL_COUNT);

      for (let i = 0; i < difficulties.length; i++) {
        const { gridSize, taps } = difficulties[i];
        const baseSeed = 4242 + packIndex * 10000 + i * 131;
        let puzzle = null;
        for (let attempt = 0; attempt < 6 && !puzzle; attempt++) {
          puzzle = generatePuzzle(gridSize, taps, baseSeed + attempt * 10007, usedSignatures, packDef.mechanic);
        }

        if (!puzzle) {
          puzzle = generatePuzzle(gridSize, taps, baseSeed + 77777, usedSignatures, packDef.mechanic);
        }

        if (!puzzle) {
          for (let fallbackAttempt = 0; fallbackAttempt < 6; fallbackAttempt++) {
            const fallbackSeed = baseSeed + 99999 + fallbackAttempt * 911;
            const fallbackRandom = createSeededRandom(fallbackSeed);
            const solution = placementStrategies.random(fallbackRandom, gridSize, taps);
            const blocks = mechanicHas(packDef.mechanic, 'blocks')
              ? buildBlockMask(gridSize, fallbackSeed + 12345, Math.max(1, Math.min(gridSize + 1, Math.floor(gridSize * 0.7))))
              : null;
            const winds = mechanicHas(packDef.mechanic, 'wind')
              ? buildWindLayout(gridSize, solution, fallbackSeed + 31415)
              : null;
            const grid = buildGridFromSolution(gridSize, solution, { mechanic: packDef.mechanic, blocks, windCells: winds });
            const candidate = { grid, solution, tapsRequired: taps, blocks: blocks || [], winds: winds || [], needsSignature: true };
            if (mechanicHas(packDef.mechanic, 'dots')) {
              applyDotsToGrid(candidate.grid, gridSize, solution, fallbackSeed + 424242, packDef.mechanic, candidate.blocks, candidate.winds);
              candidate.dotsApplied = true;
            }
            if (mechanicHas(packDef.mechanic, 'wind')) {
              if (!candidate.winds || candidate.winds.length === 0) {
                candidate.winds = buildWindLayout(gridSize, solution, fallbackSeed + 51515);
              }
            }
            if (verifyPuzzleSolution(candidate.grid, gridSize, solution, packDef.mechanic, candidate.blocks, candidate.winds)) {
              puzzle = candidate;
              break;
            }
          }
        }

        let hasDots = mechanicHas(packDef.mechanic, 'dots');
        if (hasDots && !puzzle.dotsApplied) {
          applyDotsToGrid(puzzle.grid, gridSize, puzzle.solution, baseSeed + 424242, packDef.mechanic, puzzle.blocks || [], puzzle.winds || []);
        }
        if (mechanicHas(packDef.mechanic, 'wind')) {
          if (!puzzle.winds || puzzle.winds.length === 0) {
            puzzle.winds = buildWindLayout(gridSize, puzzle.solution, baseSeed + 51515);
          }
        }
        if (!verifyPuzzleSolution(puzzle.grid, gridSize, puzzle.solution, packDef.mechanic, puzzle.blocks || [], puzzle.winds || [])) {
          puzzle = null;
          i -= 1;
          continue;
        }
        if (puzzle.needsSignature) {
          const signature = canonicalPuzzleSignature(puzzle.grid);
          if (!usedSignatures.has(signature)) {
            usedSignatures.add(signature);
          }
          puzzle.needsSignature = false;
        }

        levels.push({
          id: i + 1,
          gridSize,
          palette: (packDef.palette + i) % PALETTES.length,
          initial: puzzle.grid,
          solution: puzzle.solution,
          tapsRequired: puzzle.tapsRequired,
          hasDots,
          mechanic: packDef.mechanic,
          blocks: puzzle.blocks || [],
          winds: puzzle.winds || [],
        });
      }

      return levels;
    }

      let hash = 0;
      for (let i = 0; i < str.length; i++) {

      }
      return Math.abs(hash);

              if (!candidate.winds || candidate.winds.length === 0) {
                candidate.winds = buildWindLayout(diff.gridSize, solution, fallbackSeed + 3333 + 515);

            if (verifyPuzzleSolution(candidate.grid, diff.gridSize, solution, mechanic, candidate.blocks, candidate.winds)) {
              puzzle = candidate;

        if (state.stats.levelsByMechanic[mechanic] !== undefined) {

      const progress = getDailyProgress();
      if (!state.daily.completedToday && progress.doneCount === progress.total) {
        state.daily.completedToday = true;
        const yesterday = getYesterdayKey();
        if (state.daily.lastCompletedKey === yesterday) {
          state.daily.streak += 1;

          state.daily.streak = 1;

        state.daily.lastCompletedKey = state.daily.dateKey;
        state.stats.dailyCompletions += 1;
        state.stats.streakBest = Math.max(state.stats.streakBest, state.daily.streak);

    function rebuildStatsFromProgress() {
      const stats = createDefaultStats();
      for (const key of state.completedLevels) {
        const parts = key.split(':');
        if (parts.length !== 2) continue;
        const packIndex = parseInt(parts[0], 10);
        const levelIndex = parseInt(parts[1], 10);
        if (Number.isNaN(packIndex) || Number.isNaN(levelIndex)) continue;
        const pack = PACKS[packIndex];
        if (!pack) continue;
        stats.levelsCompleted += 1;
        const mech = pack.mechanic;
        if (stats.levelsByMechanic[mech] !== undefined) {
          stats.levelsByMechanic[mech] += 1;

      return stats;

    function remapCompletedLevels(keys, hasLegacyEcho = false) {
      const remapped = [];
      for (const key of keys) {
        const parts = key.split(':');
        if (parts.length !== 2) continue;
        const packIndex = parseInt(parts[0], 10);
        const levelIndex = parseInt(parts[1], 10);
        if (Number.isNaN(packIndex) || Number.isNaN(levelIndex)) continue;
        let newPackIndex = packIndex;
        if (hasLegacyEcho) {
          if (packIndex === 3) newPackIndex = 2; // old blocks -> new earth
          if (packIndex === 2) continue; // old echo dropped
        }
        if (newPackIndex < 0 || newPackIndex >= PACKS.length) continue;
        const pack = PACKS[newPackIndex];
        if (!pack || levelIndex < 0 || levelIndex >= pack.levels.length) continue;
        remapped.push(levelKey(newPackIndex, levelIndex));
      }
      return remapped;

      const unlocked = new Set(state.achievementsUnlocked || []);
      const context = getAchievementContext();
      let changed = false;

        if (!unlocked.has(ach.id) && ach.check(context)) {
